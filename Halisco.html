<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halisco: Boss Protocol - Fullscreen Edition</title>
    <style>
        :root {
            --tactical-green: #00ff41;
            --ui-bg: #050505;
            --damage-red: #ff3131;
            --damage-orange: #ff9900;
            --regen-blue: #31d7ff;
            --bone-white: #e0e0e0;
            --bloody-red: #990000;
            --glove-base: #1c1c1f;
            --glove-plate: #2d2e33;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            color: var(--tactical-green);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            cursor: default;
            transition: box-shadow 0.5s ease-in-out;
        }

        #game-container.death-border {
            box-shadow: inset 0 0 50px rgba(153, 0, 0, 0.8);
        }

        #damage-vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 40;
            box-shadow: inset 0 0px rgba(255, 0, 0, 0);
            transition: box-shadow 0.05s ease-out;
        }

        #damage-vignette.blood-pulse {
            box-shadow: inset 0 0 100px rgba(180, 0, 0, 0.95);
            transition: none;
        }

        #heal-flash-vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 41;
            opacity: 0;
            box-shadow: inset 0 0 80px rgba(0, 255, 65, 0.85);
        }

        @keyframes healPulse {
            0% { opacity: 0; box-shadow: inset 0 0 40px rgba(0, 255, 65, 0.4); }
            25% { opacity: 1; box-shadow: inset 0 0 100px rgba(0, 255, 65, 0.95); }
            50% { opacity: 0.3; box-shadow: inset 0 0 50px rgba(0, 255, 65, 0.5); }
            75% { opacity: 0.9; box-shadow: inset 0 0 90px rgba(0, 255, 65, 0.85); }
            100% { opacity: 0; box-shadow: inset 0 0 0px rgba(0, 255, 65, 0); }
        }

        .healing-flash-active {
            animation: healPulse 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        canvas#gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #menu-particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 101;
        }

        #top-right-hud {
            position: absolute;
            top: 30px;
            right: 30px;
            display: none;
            gap: 25px;
            z-index: 10;
            pointer-events: none;
            transform-origin: top right;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #top-right-hud.shrunk {
            transform: scale(0.95);
        }

        #hud-stats {
            background: rgba(5, 5, 5, 0.85);
            border: 2px solid #333;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            min-width: 240px;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        #minimap {
            width: 180px;
            height: 180px;
            border: 2px solid #333;
            background: rgba(5, 5, 5, 0.85);
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        .hud-line {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .hud-label {
            color: #666;
            text-transform: uppercase;
        }

        .hud-val {
            color: var(--tactical-green);
        }

        #bottom-left-hud {
            position: absolute;
            bottom: 35px;
            left: 35px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            pointer-events: none;
            transform-origin: bottom left;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #bottom-left-hud.expanded {
            transform: scale(1.35);
        }

        .health-label {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            text-shadow: 0 0 5px #000;
        }

        #health-bar-container {
            width: 320px;
            height: 22px;
            background: rgba(5, 5, 5, 0.75);
            border: 2px solid #444;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            overflow: hidden;
            transition: border-color 0.3s;
        }

        #health-bar-fill {
            width: 100%;
            height: 100%;
            background-color: var(--tactical-green);
            transition: width 0.1s ease-out, background-color 0.3s ease;
        }

        #bottom-right-hud {
            position: absolute;
            bottom: 35px;
            right: 35px;
            display: none;
            flex-direction: column;
            align-items: flex-end;
            z-index: 10;
            pointer-events: none;
            background: rgba(5, 5, 5, 0.85);
            border: 2px solid #333;
            padding: 14px 22px;
            box-shadow: 0 0 10px rgba(0,0,0,0.7);
            min-width: 200px;
        }

        .cooldown-label {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        #cooldown-status {
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #bottom-middle-hud {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 10;
            pointer-events: none;
            display: flex;
            gap: 15px;
        }

        .hud-circle-wrapper {
            position: relative;
            width: 65px;
            height: 65px;
        }

        .hud-circle-container {
            width: 100%;
            height: 100%;
            border: 2px solid var(--tactical-green);
            border-radius: 50%;
            background: rgba(15, 15, 15, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(0, 255, 65, 0.25);
            overflow: hidden;
        }

        .hud-circle-container svg {
            width: 95%;
            height: 95%;
        }

        .hud-hotkey-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #050505;
            border: 1.5px solid var(--tactical-green);
            color: var(--tactical-green);
            font-size: 0.75rem;
            font-weight: bold;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 6px rgba(0, 255, 65, 0.4);
            z-index: 12;
        }

        .cooldown-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--damage-orange);
            font-weight: bold;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 11;
        }

        .cooldown-overlay.active {
            opacity: 1;
        }

        .status-ready {
            color: var(--tactical-green);
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.5);
        }

        .status-charging {
            color: var(--damage-orange);
        }

        #center-reload-hud {
            position: absolute;
            top: 58%; 
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--damage-orange);
            text-shadow: 0 0 8px rgba(255, 153, 0, 0.6), 0 0 2px #000;
            display: none;
            pointer-events: none;
            z-index: 35;
        }

        #weapon-wrapper {
            position: absolute;
            bottom: -35px; left: 50%;
            transform: translateX(-50%);
            width: 450px; 
            pointer-events: none;
            z-index: 5;
            transition: transform 0.1s ease-out;
            display: none;
        }

        #grenade-arm-wrapper {
            position: absolute;
            bottom: -380px; 
            left: -50px;
            width: 400px;
            height: 400px;
            pointer-events: none;
            z-index: 6;
            transform: rotate(25deg);
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), bottom 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            display: none;
        }

        #grenade-arm-wrapper.throwing {
            bottom: -60px;
            left: 60px;
            transform: rotate(-15deg) scale(1.1);
        }

        #medkit-use-wrapper {
            position: absolute;
            bottom: -350px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 320px;
            pointer-events: none;
            z-index: 7;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1), bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            display: none;
        }

        #medkit-use-wrapper.using {
            bottom: -20px;
            transform: translateX(-50%) scale(1.05);
        }

        #medkit-use-wrapper.healing-shake {
            animation: medkitWobble 0.8s ease-in-out infinite alternate;
        }

        @keyframes medkitWobble {
            0% { transform: translateX(-50%) translateY(0) rotate(0deg); }
            50% { transform: translateX(-48%) translateY(-5px) rotate(2deg); }
            100% { transform: translateX(-52%) translateY(3px) rotate(-2deg); }
        }

        .machete-blade {
            fill: #8a9597;
            stroke: #cbd5e1;
            stroke-width: 0.5;
        }

        #muzzle-flash {
            position: absolute;
            top: 6%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 240px; height: 240px;
            background: radial-gradient(circle, #fff 0%, var(--tactical-green) 45%, transparent 70%);
            display: none;
            z-index: 4;
            pointer-events: none;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--tactical-green);
            font-size: 36px;
            pointer-events: none;
            z-index: 6;
            display: none;
        }

        #notification {
            position: absolute;
            top: 25%; left: 50%;
            transform: translateX(-50%);
            font-size: 4rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 20px #000;
            z-index: 50;
            display: none;
            pointer-events: none;
            white-space: nowrap;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15, 5, 5, 0.98) 0%, rgba(0, 0, 0, 0.99) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }

        #overlay h1 {
            font-size: 6.5rem;
            margin-top: 0;
            margin-bottom: 2rem;
            letter-spacing: 16px;
            color: #d1c7bd;
            text-shadow: 0 0 35px rgba(153, 0, 0, 0.95), 0 0 50px rgba(0, 0, 0, 0.9);
            font-weight: 900;
        }

        #menu-options-container, #difficulty-options-container, #tdm-difficulty-options-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 105;
            width: 380px;
        }

        #difficulty-options-container, #tdm-difficulty-options-container {
            display: none;
        }

        .menu-btn {
            background: rgba(10, 5, 5, 0.75);
            border: 1px solid #444;
            color: #999;
            padding: 16px 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.25rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.6);
        }

        .menu-btn.active-mode {
            color: var(--tactical-green);
            border-color: var(--tactical-green);
        }

        .menu-btn.active-mode:hover {
            background: rgba(0, 255, 65, 0.12);
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.5);
            transform: scale(1.04);
        }

        #btn-diff-normal:hover, #btn-tdm-normal:hover { border-color: #00ff41; box-shadow: 0 0 25px rgba(0, 255, 65, 0.4); background: rgba(0, 255, 65, 0.08); color: #00ff41;}
        #btn-diff-medium:hover, #btn-tdm-medium:hover { border-color: #ffaa00; box-shadow: 0 0 25px rgba(255, 170, 0, 0.4); background: rgba(255, 170, 0, 0.08); color: #ffaa00;}
        #btn-diff-hard:hover, #btn-tdm-hard:hover { border-color: #ff5500; box-shadow: 0 0 25px rgba(255, 85, 0, 0.4); background: rgba(255, 85, 0, 0.08); color: #ff5500;}
        #btn-diff-impossible:hover, #btn-tdm-impossible:hover { border-color: #ff3131; box-shadow: 0 0 25px rgba(255, 49, 49, 0.5); background: rgba(255, 49, 49, 0.1); color: #ff3131;}

        .menu-btn.locked-mode {
            color: #333;
            border-color: #1a1a1a;
            cursor: not-allowed;
        }

        #death-notice-sub {
            z-index: 105;
            font-size: 1.25rem;
            letter-spacing: 3px;
            text-shadow: 0 0 8px rgba(255, 49, 49, 0.4);
            color: var(--damage-red);
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .blink {
            animation: blinker 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes blinker { 50% { opacity: 0.15; } }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="damage-vignette"></div>
        <div id="heal-flash-vignette"></div>

        <div id="notification">WAVE 1 ARRIVING</div>
        <div id="overlay">
            <canvas id="menu-particles"></canvas>
            <h1 id="overlay-title">HALISCO</h1>
            
            <div id="menu-options-container">
                <button class="menu-btn active-mode" id="btn-uprising">Uprising (waves)</button>
                <button class="menu-btn active-mode" id="btn-tdm">Team Deathmatch</button>
                <button class="menu-btn locked-mode" disabled>Settings</button>
            </div>

            <div id="difficulty-options-container">
                <button class="menu-btn" id="btn-diff-normal">Normal</button>
                <button class="menu-btn" id="btn-diff-medium">Medium</button>
                <button class="menu-btn" id="btn-diff-hard">Hard</button>
                <button class="menu-btn" id="btn-diff-impossible">Impossible</button>
            </div>

            <div id="tdm-difficulty-options-container">
                <button class="menu-btn" id="btn-tdm-normal">Normal: 25 Enemies</button>
                <button class="menu-btn" id="btn-tdm-medium">Medium: 50 Enemies</button>
                <button class="menu-btn" id="btn-tdm-hard">Hard: 75 Enemies</button>
                <button class="menu-btn" id="btn-tdm-impossible">Impossible: 100 Enemies</button>
            </div>

            <p id="death-notice-sub" class="blink">CLICK TO GO BACK TO THE MAIN MENU</p>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div id="top-right-hud">
            <div id="hud-stats">
                <div class="hud-line"><span class="hud-label">MODE:</span><span id="hud-mode" class="hud-val">-</span></div>
                <div class="hud-line"><span class="hud-label">RISK LEVEL:</span><span id="hud-diff" class="hud-val">-</span></div>
                <div class="hud-line"><span class="hud-label" id="hud-label-dynamic">WAVE:</span><span id="hud-wave" class="hud-val">1/4</span></div>
                <div class="hud-line"><span class="hud-label">KILLS:</span><span id="hud-kills" class="hud-val">0</span></div>
                <div class="hud-line"><span class="hud-label">REMAINING:</span><span id="hud-remain" class="hud-val">10</span></div>
                <div class="hud-line"><span class="hud-label">AMMO:</span><span id="hud-ammo" class="hud-val">30/30</span></div>
            </div>
            <canvas id="minimap" width="180" height="180"></canvas>
        </div>

        <div id="bottom-left-hud">
            <div class="health-label">Armor Integrity <span id="health-text">100%</span></div>
            <div id="health-bar-container">
                <div id="health-bar-fill"></div>
            </div>
        </div>

        <div id="bottom-middle-hud">
            <div class="hud-circle-wrapper">
                <div id="swap-preview-circle" class="hud-circle-container"></div>
                <div class="hud-hotkey-badge">1</div>
            </div>
            <div class="hud-circle-wrapper">
                <div id="medkit-circle" class="hud-circle-container"></div>
                <div id="medkit-cooldown-text" class="cooldown-overlay">20s</div>
                <div class="hud-hotkey-badge">2</div>
            </div>
        </div>

        <div id="bottom-right-hud">
            <div class="cooldown-label">AUX WEAPON</div>
            <div id="cooldown-status" class="status-ready">GRENADE: READY</div>
        </div>

        <div id="center-reload-hud">Reloading...</div>

        <div id="crosshair">⌖</div>
        
        <div id="weapon-wrapper">
            <div id="muzzle-flash"></div>
            <svg id="weapon-svg" viewBox="0 0 200 200"></svg>
        </div>

        <div id="grenade-arm-wrapper">
            <svg id="grenade-arm-svg" viewBox="0 0 200 200" style="width:100%; height:100%;"></svg>
        </div>

        <div id="medkit-use-wrapper">
            <svg id="medkit-use-svg" viewBox="0 0 200 200" style="width:100%; height:100%;"></svg>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const mctx = minimapCanvas.getContext('2d');
const pCanvas = document.getElementById('menu-particles');
const pctx = pCanvas.getContext('2d');
const gameContainer = document.getElementById('game-container');
const weaponWrap = document.getElementById('weapon-wrapper');
const weaponSvg = document.getElementById('weapon-svg');
const grenadeArmWrap = document.getElementById('grenade-arm-wrapper');
const grenadeArmSvg = document.getElementById('grenade-arm-svg');
const medkitUseWrap = document.getElementById('medkit-use-wrapper');
const medkitUseSvg = document.getElementById('medkit-use-svg');
const muzzle = document.getElementById('muzzle-flash');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const menuOptionsContainer = document.getElementById('menu-options-container');
const difficultyOptionsContainer = document.getElementById('difficulty-options-container');
const tdmDifficultyOptionsContainer = document.getElementById('tdm-difficulty-options-container');
const deathNoticeSub = document.getElementById('death-notice-sub');
const btnUprising = document.getElementById('btn-uprising');
const btnTDM = document.getElementById('btn-tdm');
const crosshair = document.getElementById('crosshair');
const notify = document.getElementById('notification');
const topHUD = document.getElementById('top-right-hud');
const bottomLeftHUD = document.getElementById('bottom-left-hud');
const bottomMiddleHUD = document.getElementById('bottom-middle-hud');
const swapPreviewCircle = document.getElementById('swap-preview-circle');
const medkitCircle = document.getElementById('medkit-circle');
const medkitCooldownText = document.getElementById('medkit-cooldown-text');
const bottomRightHUD = document.getElementById('bottom-right-hud');
const centerReloadHUD = document.getElementById('center-reload-hud');
const damageVignette = document.getElementById('damage-vignette');
const healFlashVignette = document.getElementById('heal-flash-vignette');
const cooldownStatus = document.getElementById('cooldown-status');

let gameState = 'menu'; 
let gameMode = 'uprising'; // 'uprising' or 'tdm'
let worldMap = [];
let enemies = [];
let teammates = [];
let projectiles = [];
let grenades = []; 
let wave = 1;
let tdmTotalEnemies = 25;
let killsInWave = 0;
let totalKillsTDM = 0;
let enemiesSpawnedInWave = 0;
let screenShakeTime = 0;
let vignetteTimeout = null;
let menuAshArray = [];
let zBuffer = [];
let environmentObjects = []; // Stores tree data for TDM green zone maps

let selectedDifficulty = 'Normal'; 
const difficultyModifiers = {
    'Normal':     { extraHealth: 0,  fireRateMultiplier: 1.0,   labelColor: "var(--tactical-green)", tdmCount: 25 },
    'Medium':     { extraHealth: 30, fireRateMultiplier: 0.82,  labelColor: "#ffaa00",               tdmCount: 50 },
    'Hard':       { extraHealth: 45, fireRateMultiplier: 0.70,  labelColor: "#ff5500",               tdmCount: 75 },
    'Impossible': { extraHealth: 75, fireRateMultiplier: 0.52,  labelColor: "#ff3131",               tdmCount: 100 }
};

const BASE_ENEMIES = 10;
const MAX_WAVES = 4;
const MAP_SIZE = 24; // Increased map size to better facilitate 110-entity sandbox limits

let isFiringContinuous = false;
let lastAutoShotTime = 0;
const AUTO_FIRE_RATE = 100; 

const SVG_GLOVE_FRAGMENTS = `
    <path d="M 82 125 L 72 200 L 132 200 L 114 125 Z" fill="var(--glove-base)" stroke="#111" stroke-width="1"/>
    <polygon points="84,140 94,195 106,195 110,140" fill="var(--glove-plate)"/>
    <circle cx="97" cy="155" r="4" fill="var(--tactical-green)" fill-opacity="0.4"/>
    <rect x="86" y="112" width="10" height="15" fill="var(--glove-base)" rx="2"/>
    <rect x="96" y="110" width="10" height="17" fill="var(--glove-base)" rx="2"/>
    <rect x="106" y="114" width="9" height="15" fill="var(--glove-base)" rx="2"/>
`;

const SVG_LEFT_GLOVE_FRAGMENTS = `
    <path d="M 118 125 L 128 200 L 68 200 L 86 125 Z" fill="var(--glove-base)" stroke="#111" stroke-width="1"/>
    <polygon points="116,140 106,195 94,195 90,140" fill="var(--glove-plate)"/>
    <circle cx="103" cy="155" r="4" fill="var(--tactical-green)" fill-opacity="0.4"/>
    <rect x="104" y="112" width="10" height="15" fill="var(--glove-base)" rx="2"/>
    <rect x="94" y="110" width="10" height="17" fill="var(--glove-base)" rx="2"/>
    <rect x="85" y="114" width="9" height="15" fill="var(--glove-base)" rx="2"/>
`;

const GUN_SVG_MARKUP = `
    <rect x="76" y="85" width="48" height="25" fill="#141416" stroke="#222" stroke-width="0.5" />
    <rect x="78" y="78" width="44" height="8" fill="#1c1c1f" />
    <rect x="80" y="73" width="40" height="5" fill="#0d0d0e" />

function createMenuParticle(initializeFullHeight = false) {
    const isFire = Math.random() > 0.40; 
    return {
        type: isFire ? 'fire' : 'ash',
        x: Math.random() * pCanvas.width,
        y: initializeFullHeight ? (Math.random() * pCanvas.height) : (pCanvas.height + 15),
        speed: isFire ? (1.0 + Math.random() * 1.8) : (0.4 + Math.random() * 0.9),
        size: isFire ? (2.0 + Math.random() * 4) : (2.5 + Math.random() * 5),
        maxSize: isFire ? 5 : 6,
        driftFreq: Math.random() * 0.02,
        driftPhase: Math.random() * Math.PI * 2,
        opacity: isFire ? (0.65 + Math.random() * 0.35) : (0.25 + Math.random() * 0.35),
        hue: isFire ? (Math.random() > 0.25 ? Math.floor(12 + Math.random() * 23) : Math.floor(35 + Math.random() * 25)) : 0 
    };
}

function initMenuParticles() {
    menuAshArray = [];
    for(let i = 0; i < 450; i++) {
        menuAshArray.push(createMenuParticle(true));
    }
}
initMenuParticles();

function handleMenuParticles() {
    if (gameState === 'playing') return;
    pctx.clearRect(0, 0, pCanvas.width, pCanvas.height);
    pctx.globalCompositeOperation = 'screen';

    menuAshArray.forEach((p, idx) => {
        p.y -= p.speed;
        p.x += Math.sin(p.y * p.driftFreq + p.driftPhase) * 0.5;

        if (p.type === 'fire') {
            p.size -= 0.008;
            p.opacity -= 0.0025;
            
            if (p.y < -10 || p.size <= 0.2 || p.opacity <= 0) {
                menuAshArray[idx] = createMenuParticle(false);
                return;
            }
            
            pctx.fillStyle = `hsla(${p.hue}, 100%, 50%, ${p.opacity * (0.75 + Math.random() * 0.25)})`;
            pctx.fillRect(p.x, p.y, p.size, p.size);
        } else {
            if (p.y < -10) {
                menuAshArray[idx] = createMenuParticle(false);
                return;
            }
            
            pctx.fillStyle = `rgba(110, 105, 105, ${p.opacity})`;
            pctx.fillRect(p.x, p.y, p.size, p.size);
        }
    });

    pctx.globalCompositeOperation = 'source-over';
}

function getEnemiesForWave(w) {
    if (gameMode === 'tdm') return tdmTotalEnemies;
    if (w === 4) return 1;
    return BASE_ENEMIES + ((w - 1) * 5);
}

function startWave() {
    killsInWave = 0;
    enemiesSpawnedInWave = 0;
    enemies = [];
    
    if (wave === 4) {
        showNotification("BOSS FIGHT", "var(--damage-red)");
        triggerVoice("Extreme threat detected. Boss fight initiated.");
        screenShakeTime = 300; 
        spawnEnemy(true);
    } else {
        showNotification(`WAVE ${wave} ARRIVING`);
        for(let i=0; i<6; i++) spawnEnemy();
    }
    updateUI();
}

function spawnEnemy(isBoss = false) {
    if (gameMode === 'uprising' && enemiesSpawnedInWave >= getEnemiesForWave(wave)) return;
    let ex, ey;
    do {
        ex = Math.random() * (MAP_SIZE - 2) + 1;
        ey = Math.random() * (MAP_SIZE - 2) + 1;
    } while (worldMap[Math.floor(ey)][Math.floor(ex)] !== 0 || Math.hypot(ex-player.x, ey-player.y) < 5);
    
    let isMelee = !isBoss && (gameMode === 'uprising' && Math.random() < 0.25);
    const activeMod = difficultyModifiers[selectedDifficulty];
    let baseEnemyHealth = isBoss ? 1000 : (100 + activeMod.extraHealth);

    enemies.push({ 
        x: ex, y: ey, 
        health: baseEnemyHealth, 
        maxHealth: baseEnemyHealth,
        lastShot: Date.now() + (Math.random() * 2000), 
        hitFlash: 0, 
        isFiring: false,
        isBoss: isBoss,
        isMelee: isMelee,
        swingTime: 0,
        isDying: false,       
        deathTimer: 0,        
        scale: isBoss ? 2.0 : 1.0,
        renderX: 0,
        renderSize: 0
    });
    enemiesSpawnedInWave++;
}

function spawnTeammate() {
    let tx, ty;
    do {
        tx = Math.random() * (MAP_SIZE - 4) + 2;
        ty = Math.random() * (MAP_SIZE - 4) + 2;
    } while (worldMap[Math.floor(ty)][Math.floor(tx)] !== 0 || Math.hypot(tx-player.x, ty-player.y) > 8);

    teammates.push({
        x: tx, y: ty,
        health: 120,
        maxHealth: 120,
        lastShot: Date.now() + (Math.random() * 1500),
        hitFlash: 0,
        isFiring: false,
        isDying: false,
        deathTimer: 0,
        renderX: 0,
        renderSize: 0
    });
}

function switchWeapon() {
    if (player.reloading || player.isMeleeSwinging || player.isHealing) return;
    
    player.currentWeapon = (player.currentWeapon === 'gun') ? 'machete' : 'gun';
    isFiringContinuous = false;
    
    const pitchOffset = player.pitch * -0.15;
    weaponWrap.style.transition = "transform 0.15s ease-in";
    weaponWrap.style.transform = `translateX(-50%) translateY(${250 + pitchOffset}px)`;
    
    setTimeout(() => {
        renderEquippedWeapon();
        updateUI();
        weaponWrap.style.transition = "transform 0.15s ease-out";
        weaponWrap.style.transform = `translateX(-50%) translateY(${pitchOffset}px)`;

function useMedkit() {
    const now = Date.now();
    if (now - player.lastMedkitTime < player.medkitCooldown || player.isHealing || player.reloading) return;
    if (player.health >= 100) {
        showNotification("ARMOR AT MAX CAPACITY", "var(--tactical-green)");
        return;
    }

    player.isHealing = true;
    isFiringContinuous = false;
    player.lastMedkitTime = now;

    const pitchOffset = player.pitch * -0.15;
    weaponWrap.style.transition = "transform 0.25s ease-in";
    weaponWrap.style.transform = `translateX(-50%) translateY(${300 + pitchOffset}px)`;

    setTimeout(() => {
        medkitUseWrap.classList.add('using');
        
        setTimeout(() => {
            medkitUseWrap.classList.add('healing-shake');
            triggerVoice("Armor integrity structural integrity restored");
            showNotification("ARMOR RECONSTRUCTED", "var(--tactical-green)");
            
            healFlashVignette.classList.remove('healing-flash-active');
            void healFlashVignette.offsetWidth; 
            healFlashVignette.classList.add('healing-flash-active');

            player.health = 100;
            updateUI();

            setTimeout(() => {
                medkitUseWrap.classList.remove('healing-shake');
                medkitUseWrap.classList.remove('using');
                
                setTimeout(() => {
                    const endPitch = player.pitch * -0.15;
                    weaponWrap.style.transition = "transform 0.25s ease-out";
                    weaponWrap.style.transform = `translateX(-50%) translateY(${endPitch}px)`;
                    player.isHealing = false;
                }, 200);
            }, 1000);
        }, 400);
    }, 150);
}

function updateUI() {
    const healthPercent = Math.max(0, Math.floor(player.health));
    const healthBarFill = document.getElementById('health-bar-fill');
    const healthBarContainer = document.getElementById('health-bar-container');
    const healthText = document.getElementById('health-text');
    
    healthBarFill.style.width = healthPercent + "%";
    healthText.innerText = healthPercent + "%";

    const isRegenerating = (Date.now() - player.lastDamageTime > 6000 && player.health < 100);

    if (healthPercent >= 60) {
        healthBarFill.style.backgroundColor = "var(--tactical-green)";
        healthText.style.color = "var(--tactical-green)";
    } else if (healthPercent >= 30) {
        healthBarFill.style.backgroundColor = "var(--damage-orange)";
        healthText.style.color = "var(--damage-orange)";
    } else {
        healthBarFill.style.backgroundColor = "var(--damage-red)";
        healthText.style.color = "var(--damage-red)";
    }

    if (healthPercent < 50) {
        bottomLeftHUD.classList.add('expanded');
        topHUD.classList.add('shrunk');
    } else {
        bottomLeftHUD.classList.remove('expanded');
        topHUD.classList.remove('shrunk');
    }

    if (isRegenerating) {
        healthBarContainer.style.borderColor = "var(--regen-blue)";
    } else {
        healthBarContainer.style.borderColor = "#444";
    }

    document.getElementById('hud-mode').innerText = gameMode === 'uprising' ? 'UPRISING' : 'TEAM DM';

    if (player.currentWeapon === 'gun') {
        document.getElementById('hud-ammo').innerText = `${player.ammo}/30`;
    } else {
        document.getElementById('hud-ammo').innerText = `MELEE`;
    }
    
    const activeMod = difficultyModifiers[selectedDifficulty];
    const diffDisplay = document.getElementById('hud-diff');
    diffDisplay.innerText = selectedDifficulty;
    diffDisplay.style.color = activeMod.labelColor;

    if (gameMode === 'tdm') {
        const activeTeammates = teammates.filter(t => !t.isDying).length;
        document.getElementById('hud-wave').innerText = `${activeTeammates + 1}/10`; // Includes player
        document.getElementById('hud-kills').innerText = totalKillsTDM;
        document.getElementById('hud-remain').innerText = enemies.filter(e => !e.isDying).length;
    } else {
        let remainingSkeletons = getEnemiesForWave(wave) - killsInWave;
        document.getElementById('hud-wave').innerText = `${wave}/${MAX_WAVES}`;
        document.getElementById('hud-kills').innerText = killsInWave;
        document.getElementById('hud-remain').innerText = Math.max(0, remainingSkeletons);
    }
    
    updateAuxiliaryCooldowns();
}

function updateAuxiliaryCooldowns() {
    const now = Date.now();
    
    const grenadeElapsed = now - player.lastGrenadeTime;
    if (grenadeElapsed < player.grenadeCooldown) {
        const grenadeLeft = ((player.grenadeCooldown - grenadeElapsed) / 1000).toFixed(1);
        cooldownStatus.innerText = `GRENADE: ${grenadeLeft}s`;
        cooldownStatus.className = "status-charging";
    } else {
        cooldownStatus.innerText = "GRENADE: READY";
        cooldownStatus.className = "status-ready";
    }

    const medkitElapsed = now - player.lastMedkitTime;
    if (medkitElapsed < player.medkitCooldown) {
        const medkitLeft = Math.ceil((player.medkitCooldown - medkitElapsed) / 1000);
        medkitCooldownText.innerText = `${medkitLeft}s`;
        medkitCooldownText.classList.add('active');
        medkitCircle.style.borderColor = "var(--damage-orange)";
    } else {
        medkitCooldownText.classList.remove('active');
        medkitCircle.style.borderColor = "var(--tactical-green)";
    }
}

function registerPlayerDamage(amount) {
    if (player.isHealing) return; 
    player.health -= amount;
    player.lastDamageTime = Date.now();
    
    if (player.health < 50) {
        damageVignette.classList.remove('blood-pulse');
        void damageVignette.offsetWidth; 
        damageVignette.classList.add('blood-pulse');
        
        clearTimeout(vignetteTimeout);
        vignetteTimeout = setTimeout(() => {
            damageVignette.classList.remove('blood-pulse');
        }, 50); 
    }

    updateUI();
    checkGameOver();
}

function handleRegeneration() {
    const now = Date.now();
    if (now - player.lastDamageTime > 6000) {
        if (player.health < 100 && now - player.lastRegenTick > 1000) {
            player.health = Math.min(100, player.health + 5); 
            player.lastRegenTick = now;
            updateUI();
        }
    }
}

function checkGameOver() {
    if (player.health <= 0) {
        gameState = 'over';
        isFiringContinuous = false;
        document.exitPointerLock();
        
        gameContainer.classList.add('death-border');
        gameContainer.style.cursor = 'pointer';

        overlay.style.display = 'flex';
        topHUD.style.display = 'none';
        bottomLeftHUD.style.display = 'none';
        bottomMiddleHUD.style.display = 'none';
        bottomRightHUD.style.display = 'none';
        centerReloadHUD.style.display = 'none';
        
        menuOptionsContainer.style.display = 'none';
        difficultyOptionsContainer.style.display = 'none';
        tdmDifficultyOptionsContainer.style.display = 'none';
        deathNoticeSub.style.display = 'block';
        deathNoticeSub.innerText = "CLICK TO GO BACK TO THE MAIN MENU";

        overlayTitle.innerText = "You're dead";
        overlayTitle.style.color = "var(--damage-red)";
        overlayTitle.style.textShadow = "0 0 15px rgba(255, 0, 0, 0.7)";
    }
}

function reload() {
    if (player.currentWeapon !== 'gun' || player.reloading || player.isMeleeSwinging || player.isHealing) return;
    player.reloading = true;
    isFiringContinuous = false; 
    triggerVoice("Reloading");
    
    centerReloadHUD.style.display = 'block';

    const startPitch = player.pitch * -0.15;
    weaponWrap.style.transition = "transform 0.3s ease-in";
    weaponWrap.style.transform = `translateX(-50%) translateY(${300 + startPitch}px) rotate(15deg)`;
    setTimeout(() => {
        weaponWrap.style.transform = `translateX(-50%) translateY(${280 + startPitch}px) rotate(-5deg)`;
        setTimeout(() => {
            player.ammo = 30;
            centerReloadHUD.style.display = 'none';

            updateUI();
            const endPitch = player.pitch * -0.15;
            weaponWrap.style.transition = "transform 0.2s ease-out";
            weaponWrap.style.transform = `translateX(-50%) translateY(${endPitch}px) rotate(0deg)`;
            setTimeout(() => {
                weaponWrap.style.transition = "transform 0.1s ease-out";
                player.reloading = false;
            }, 200);
        }, 400);
    }, 300);
}

function shoot() {
    if (player.reloading || player.isMeleeSwinging || player.isHealing) return;

    if (player.currentWeapon === 'machete') {
        executeMacheteSwing();
        return;
    }

    if (player.ammo <= 0) {
        isFiringContinuous = false;
        reload();
        return;
    }

    player.ammo--;
    updateUI();
    player.pitch += 6; 
    
    const currentPitchOffset = player.pitch * -0.15;
    weaponWrap.style.transition = "none";
    weaponWrap.style.transform = `translateX(-50%) translateY(${currentPitchOffset + 10}px) scale(1.03)`;
    setTimeout(() => {
        weaponWrap.style.transition = "transform 0.05s ease-out";
        weaponWrap.style.transform = `translateX(-50%) translateY(${player.pitch * -0.15}px) scale(1)`;
    }, 30);

    muzzle.style.display = 'block';
    setTimeout(() => muzzle.style.display = 'none', 30);

    evaluateHitscanDamage(15, 25);
}

function executeMacheteSwing() {
    player.isMeleeSwinging = true;
    isFiringContinuous = false;

    const pitchOffset = player.pitch * -0.15;
    weaponWrap.style.transition = "transform 0.08s cubic-bezier(0.15, 0.85, 0.35, 1.2)";
    weaponWrap.style.transform = `translateX(-30%) translateY(${pitchOffset - 20}px) rotate(35deg) scale(1.15)`;
    
    setTimeout(() => {
        weaponWrap.style.transition = "transform 0.05s ease-in";
        weaponWrap.style.transform = `translateX(-70%) translateY(${pitchOffset + 40}px) rotate(-45deg) scale(1.1)`;
        
        evaluateHitscanDamage(1.8, 50);

        setTimeout(() => {
            weaponWrap.style.transition = "transform 0.15s ease-out";
            weaponWrap.style.transform = `translateX(-50%) translateY(${pitchOffset}px) rotate(0deg) scale(1)`;
            setTimeout(() => {
                player.isMeleeSwinging = false;
            }, 150);
        }, 700);
    }, 80);
}

function evaluateHitscanDamage(maxRange, damageAmount) {
    let closestEnemy = null;
    let closestDistance = maxRange;
    const screenCenterX = canvas.width / 2;
    const screenCenterY = (canvas.height / 2) + player.pitch;

    enemies.forEach(en => {
        if (en.isDying || en.renderSize <= 0) return; 

        let dx = en.x - player.x, dy = en.y - player.y;
        let dist = Math.hypot(dx, dy);
        if (dist > closestDistance) return;

        const halfWidth = en.renderSize / 2;
        const topY = screenCenterY - (en.renderSize * 0.95);
        const bottomY = screenCenterY + (en.renderSize * 0.25);

        const withinX = screenCenterX >= (en.renderX - halfWidth) && screenCenterX <= (en.renderX + halfWidth);
        const withinY = screenCenterY >= topY && screenCenterY <= bottomY;

        if (withinX && withinY) {
            let angleToEn = Math.atan2(dy, dx);
            let clearShot = true;
            for(let d = 0.2; d < dist; d += 0.2) {
                let checkX = Math.floor(player.x + Math.cos(angleToEn) * d);
                let checkY = Math.floor(player.y + Math.sin(angleToEn) * d);
                if(worldMap[checkY] && worldMap[checkY][checkX] > 0) {
                    clearShot = false; 
                    break;
                }
            }
            
            if (clearShot) {
                closestEnemy = en;
                closestDistance = dist;
            }
        }
    });

    if (closestEnemy) {
        if (player.currentWeapon === 'machete' && !closestEnemy.isBoss) {
            closestEnemy.health = 0;
        } else {
            closestEnemy.health -= damageAmount;
        }
        
        closestEnemy.hitFlash = 3;
        if(closestEnemy.health <= 0) { 
            closestEnemy.isDying = true;
            closestEnemy.deathTimer = 30; 
            killsInWave++; 
            totalKillsTDM++;
            updateUI();
            checkWaveProgress();
        }
    }
}

function throwGrenade() {
    const now = Date.now();
    if (now - player.lastGrenadeTime < player.grenadeCooldown || player.isHealing) return; 

    player.lastGrenadeTime = now;
    grenadeArmWrap.classList.add('throwing');
    
    setTimeout(() => {
        const launchForce = 0.12;
        grenades.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(player.dir) * launchForce,
            vy: Math.sin(player.dir) * launchForce,
            life: 45 
        });
        updateUI();
        
        setTimeout(() => {
            grenadeArmWrap.classList.remove('throwing');
        }, 150);
    }, 200);
}

function processExplosion(gx, gy) {
    screenShakeTime = 25; 
    const blastRadius = 3.0;
    
    const playerDist = Math.hypot(player.x - gx, player.y - gy);
    if (playerDist <= blastRadius) {
        const damagePercentage = 1.0 - (playerDist / blastRadius);
        const playerDamage = Math.floor(damagePercentage * 60); 
        if (playerDamage > 5) registerPlayerDamage(playerDamage);
    }

    teammates.forEach(tm => {
        if (tm.isDying) return;
        const tmDist = Math.hypot(tm.x - gx, tm.y - gy);
        if (tmDist <= blastRadius) {
            const damagePercentage = 1.0 - (tmDist / blastRadius);
            tm.health -= Math.floor(damagePercentage * 150);
            if (tm.health <= 0) {
                tm.isDying = true;
                tm.deathTimer = 30;
                updateUI();
            }
        }
    });

    enemies.forEach(en => {
        if (en.isDying) return;
        const enemyDist = Math.hypot(en.x - gx, en.y - gy);
        if (enemyDist <= blastRadius) {
            const damagePercentage = 1.0 - (enemyDist / blastRadius);
            const explosiveDamage = Math.floor(damagePercentage * 250); 
            
            if (explosiveDamage > 10) {
                en.health -= explosiveDamage;
                en.hitFlash = 5;
                if (en.health <= 0) {
                    en.isDying = true;
                    en.deathTimer = 30;
                    killsInWave++;
                    totalKillsTDM++;
                    updateUI();
                    checkWaveProgress();
                }
            }
        }
    });
}

function checkWaveProgress() {
    if (gameMode === 'tdm') {
        const aliveEnemies = enemies.filter(e => !e.isDying).length;
        if (aliveEnemies === 0) {
            triggerMatchVictory();
        }
    } else {
        if (killsInWave >= getEnemiesForWave(wave)) {
            if (wave < MAX_WAVES) {
                showNotification("WAVE COMPLETE", "#fff");
                wave++;
                setTimeout(startWave, 2000);
            } else {
                triggerMatchVictory();
            }
        }
    }
}

function triggerMatchVictory() {
    gameState = 'win';
    isFiringContinuous = false;
    document.exitPointerLock();
    overlay.style.display = 'flex';
    topHUD.style.display = 'none';
    bottomLeftHUD.style.display = 'none';
    bottomMiddleHUD.style.display = 'none';
    bottomRightHUD.style.display = 'none';
    centerReloadHUD.style.display = 'none';
    
    menuOptionsContainer.style.display = 'none';
    difficultyOptionsContainer.style.display = 'none';
    tdmDifficultyOptionsContainer.style.display = 'none';
    deathNoticeSub.style.display = 'block';
    deathNoticeSub.innerText = "CLICK TO GO BACK TO THE MAIN MENU";

    overlayTitle.innerText = "MISSION SUCCESS";
    overlayTitle.style.color = "var(--tactical-green)";
}

function generateMap() {
    worldMap = Array.from({length: MAP_SIZE}, () => Array(MAP_SIZE).fill(0));
    environmentObjects = [];

    // Outer Boundaries
    for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
            if (x === 0 || x === MAP_SIZE-1 || y === 0 || y === MAP_SIZE-1) {
                worldMap[y][x] = 1;
            } else if (gameMode === 'uprising') {
                // Concrete/Industrial Maze Pillars
                if (Math.random() < 0.15) worldMap[y][x] = Math.random() > 0.5 ? 1 : 2;
            }
        }
    }

    // TDM Map Setup: Organic Environment Objects (Trees)
    if (gameMode === 'tdm') {
        const treeCount = 18;
        for (let i = 0; i < treeCount; i++) {
            let tx = Math.floor(Math.random() * (MAP_SIZE - 4)) + 2;
            let ty = Math.floor(Math.random() * (MAP_SIZE - 4)) + 2;
            if (Math.hypot(tx - player.x, ty - player.y) > 4) {
                worldMap[ty][tx] = 3; // Type 3 flag tells the compiler it represents a tree line obstruction
                environmentObjects.push({x: tx + 0.5, y: ty + 0.5, type: 'tree'});
            }
        }
    }

    // Safety clear zone for initial spawn
    for(let r=1; r<5; r++){
        for(let c=1; c<5; c++){
            worldMap[r][c] = 0;
        }
    }
}

function update() {
    handleMenuParticles();
    if (gameState !== 'playing') return;
    
    handleRegeneration();
    updateAuxiliaryCooldowns();

    if (isFiringContinuous && !player.reloading && player.currentWeapon === 'gun' && !player.isHealing) {
        const now = Date.now();
        if (now - lastAutoShotTime >= AUTO_FIRE_RATE) {
            shoot();
            lastAutoShotTime = now;
        }
    }

    if (player.pitch > 0) player.pitch *= 0.85; 
    if (player.pitch < 0) player.pitch *= 0.85;

    if (screenShakeTime > 0) {
        screenShakeTime--;
        canvas.style.transform = `translate(${(Math.random()-0.5)*15}px, ${(Math.random()-0.5)*15}px)`;
    } else {
        canvas.style.transform = `translate(0,0)`;
    }

    // Player Physics Loop
    let mx = 0, my = 0;
    if (keys['KeyW']) { mx += Math.cos(player.dir) * player.speed; my += Math.sin(player.dir) * player.speed; }
    if (keys['KeyS']) { mx -= Math.cos(player.dir) * player.speed; my -= Math.sin(player.dir) * player.speed; }
    if (keys['KeyA']) { mx += Math.cos(player.dir - 1.57) * player.speed; my += Math.sin(player.dir - 1.57) * player.speed; }
    if (keys['KeyD']) { mx += Math.cos(player.dir + 1.57) * player.speed; my += Math.sin(player.dir + 1.57) * player.speed; }

    if (worldMap[Math.floor(player.y)][Math.floor(player.x + mx)] === 0) player.x += mx;
    if (worldMap[Math.floor(player.y + my)][Math.floor(player.x)] === 0) player.y += my;

    // Ballistics Loop
    for (let i = grenades.length - 1; i >= 0; i--) {
        let g = grenades[i];
        let nex = g.x + g.vx;
        let ney = g.y + g.vy;
        if (worldMap[Math.floor(g.y)][Math.floor(nex)] > 0) { g.vx *= -0.6; nex = g.x; }
        if (worldMap[Math.floor(ney)][Math.floor(g.x)] > 0) { g.vy *= -0.6; ney = g.y; }
        g.x = nex; g.y = ney;
        g.vx *= 0.95; g.vy *= 0.95; 
        g.life--;
        if (g.life <= 0) {
            processExplosion(g.x, g.y);
            grenades.splice(i, 1);
        }
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.vx; p.y += p.vy;
        if (worldMap[Math.floor(p.y)][Math.floor(p.x)] > 0) { projectiles.splice(i, 1); continue; }
        
        // Track targets based on team alignment origin
        if (p.isTeammateProj) {
            // Evaluates projectile trajectory mapping against enemy bots
            for (let e of enemies) {
                if (!e.isDying && Math.hypot(p.x - e.x, p.y - e.y) < 0.4) {
                    e.health -= 20;
                    e.hitFlash = 3;
                    if (e.health <= 0) {
                        e.isDying = true;
                        e.deathTimer = 30;
                        totalKillsTDM++;
                        updateUI();
                        checkWaveProgress();
                    }
                    projectiles.splice(i, 1);
                    break;
                }
            }
        } else {
            // Projectile alignment from hostile forces impacts player or allied bots
            if (Math.hypot(p.x - player.x, p.y - player.y) < 0.3) {
                projectiles.splice(i, 1);
                registerPlayerDamage(10);
                continue;
            }
            let hitAlly = false;
            for (let tm of teammates) {
                if (!tm.isDying && Math.hypot(p.x - tm.x, p.y - tm.y) < 0.35) {
                    tm.health -= 12;
                    tm.hitFlash = 3;
                    if (tm.health <= 0) {
                        tm.isDying = true;
                        tm.deathTimer = 30;
                        updateUI();
                    }
                    hitAlly = true;
                    projectiles.splice(i, 1);
                    break;
                }
            }
            if (hitAlly) continue;
        }

        p.life--;
        if (p.life <= 0) projectiles.splice(i, 1);
    }

    // Teammate Processing Logic (TDM Only)
    if (gameMode === 'tdm') {
        for (let i = teammates.length - 1; i >= 0; i--) {
            let tm = teammates[i];
            if (tm.isDying) {
                tm.deathTimer--;
                if (tm.deathTimer <= 0) teammates.splice(i, 1);
                continue;
            }
            if (tm.hitFlash > 0) tm.hitFlash--;

            // Scan proximity array looking for valid hostiles
            let target = null;
            let minDist = 12;
            enemies.forEach(e => {
                if (!e.isDying) {
                    let d = Math.hypot(e.x - tm.x, e.y - tm.y);
                    if (d < minDist) { minDist = d; target = e; }
                }
            });

            if (target) {
                let ang = Math.atan2(target.y - tm.y, target.x - tm.x);
                // Move towards acquired target position
                if (minDist > 3.5) {
                    let nex = tm.x + Math.cos(ang) * 0.025;
                    let ney = tm.y + Math.sin(ang) * 0.025;
                    if (worldMap[Math.floor(tm.y)][Math.floor(nex)] === 0) tm.x = nex;
                    if (worldMap[Math.floor(ney)][Math.floor(tm.x)] === 0) tm.y = ney;
                }
                // Actively maintain suppressive fire schedules
                if (Date.now() - tm.lastShot > 1400) {
                    tm.isFiring = true;
                    tm.lastShot = Date.now();
                    projectiles.push({
                        x: tm.x, y: tm.y,
                        vx: Math.cos(ang) * 0.14, vy: Math.sin(ang) * 0.14,
                        life: 120,
                        isTeammateProj: true
                    });
                    setTimeout(() => tm.isFiring = false, 120);
                }
            }
        }
    }

    // Enemy Processing Loop
    for (let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        if (en.isDying) {
            en.deathTimer--;
            if (en.deathTimer <= 0) {
                enemies.splice(i, 1);
                if (gameMode === 'uprising' && wave < 4) {
                    while(enemies.filter(e => !e.isDying).length < 6 && enemiesSpawnedInWave < getEnemiesForWave(wave)) spawnEnemy();
                }
            }
            continue;
        }

        if (en.hitFlash > 0) en.hitFlash--;
        if (en.swingTime > 0) en.swingTime--;

        // Targets closest profile entity (Player or operational Teammates)
        let trackingTarget = player;
        let bestDist = Math.hypot(player.x - en.x, player.y - en.y);

        if (gameMode === 'tdm') {
            teammates.forEach(tm => {
                if (!tm.isDying) {
                    let d = Math.hypot(tm.x - en.x, tm.y - en.y);
                    if (d < bestDist) { bestDist = d; trackingTarget = tm; }
                }
            });
        }

        let ang = Math.atan2(trackingTarget.y - en.y, trackingTarget.x - en.x);
        let speed = en.isBoss ? 0.015 : (en.isMelee ? 0.025 : 0.02);
        
        if (bestDist > 1.2) {
            let nex = en.x + Math.cos(ang) * speed;
            let ney = en.y + Math.sin(ang) * speed;
            if (worldMap[Math.floor(en.y)][Math.floor(nex)] === 0) en.x = nex;
            if (worldMap[Math.floor(ney)][Math.floor(en.x)] === 0) en.y = ney;
        }

        if (en.isMelee) {
            if (bestDist <= 1.3 && Date.now() - en.lastShot > 1500) {
                en.swingTime = 20; 
                en.lastShot = Date.now();
                if (trackingTarget === player) {
                    screenShakeTime = 10;
                    registerPlayerDamage(15);
                } else {
                    trackingTarget.health -= 20;
                    trackingTarget.hitFlash = 3;
                    if (trackingTarget.health <= 0) {
                        trackingTarget.isDying = true;
                        trackingTarget.deathTimer = 30;
                    }
                }
            }
        } else {
            const activeMod = difficultyModifiers[selectedDifficulty];
            let fireRate = en.isBoss ? 800 : ((3000 - (wave * 200)) * activeMod.fireRateMultiplier);
            if (gameMode === 'tdm') fireRate = 2200 * activeMod.fireRateMultiplier;

            if (Date.now() - en.lastShot > fireRate) {
                en.isFiring = true;
                en.lastShot = Date.now();
                projectiles.push({
                    x: en.x, y: en.y,
                    vx: Math.cos(ang) * 0.15, vy: Math.sin(ang) * 0.15,
                    life: 150,
                    isTeammateProj: false
                });
                setTimeout(() => en.isFiring = false, 150);
            }
        }
    }
}

function drawMinimap() {
    mctx.fillStyle = "rgba(5, 5, 5, 0.85)";
    mctx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

    const cellSize = minimapCanvas.width / MAP_SIZE;

    for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
            if (worldMap[y][x] === 1) {
                mctx.fillStyle = gameMode === 'tdm' ? "#1c331c" : "#3a1515"; 
                mctx.fillRect(x * cellSize, y * cellSize, cellSize - 0.5, cellSize - 0.5);
            } else if (worldMap[y][x] === 2) {
                mctx.fillStyle = "#1e1e1e"; 
                mctx.fillRect(x * cellSize, y * cellSize, cellSize - 0.5, cellSize - 0.5);
            } else if (worldMap[y][x] === 3) {
                mctx.fillStyle = "#1a5e1a"; // Organic forest canopy node markers
                mctx.fillRect(x * cellSize, y * cellSize, cellSize - 0.5, cellSize - 0.5);
            }
        }
    }

    grenades.forEach(g => {
        mctx.fillStyle = "#ffaa00";
        mctx.fillRect(g.x * cellSize - 2, g.y * cellSize - 2, 4, 4);
    });

    teammates.forEach(tm => {
        if (tm.isDying) return;
        mctx.fillStyle = "#31d7ff";
        mctx.beginPath();
        mctx.arc(tm.x * cellSize, tm.y * cellSize, 2.5, 0, Math.PI * 2);
        mctx.fill();
    });

    enemies.forEach(en => {
        if (en.isDying) return; 
        mctx.fillStyle = en.isBoss ? "#ff3131" : "#ff5c5c";
        mctx.beginPath();
        let r = en.isBoss ? 4 : 2.5;
        mctx.arc(en.x * cellSize, en.y * cellSize, r, 0, Math.PI * 2);
        mctx.fill();
    });

    const px = player.x * cellSize;
    const py = player.y * cellSize;

    mctx.strokeStyle = "rgba(0, 255, 65, 0.4)";
    mctx.lineWidth = 1.5;
    mctx.beginPath();
    mctx.moveTo(px, py);
    mctx.lineTo(px + Math.cos(player.dir) * 15, py + Math.sin(player.dir) * 15);
    mctx.stroke();

    mctx.fillStyle = "var(--tactical-green)";
    mctx.beginPath();
    mctx.arc(px, py, 3.5, 0, Math.PI * 2);
    mctx.fill();
}

function draw() {
    if (gameState === 'menu') return;
    const horizon = (canvas.height / 2) + player.pitch;
    
    // Custom Environment Rendering Core (Concrete Bunker vs Grassy Skirmish Zone)
    ctx.fillStyle = gameMode === 'tdm' ? "#2d4a1e" : "#0a0a0d"; // Floor rendering pass
    ctx.fillRect(0, 0, canvas.width, canvas.height); 
    
    ctx.fillStyle = gameMode === 'tdm' ? "#3b5e66" : "#120808"; // Ceiling/Atmosphere space pass
    ctx.fillRect(0, 0, canvas.width, horizon); 

    const fov = 1.1;
    for (let i = 0; i < canvas.width; i++) {
        let rayA = (player.dir - fov/2) + (i / canvas.width) * fov;
        let dist = 0, hit = 0;
        let cA = Math.cos(rayA), sA = Math.sin(rayA);
        while (hit === 0 && dist < 24) {
            dist += 0.05;
            let tx = Math.floor(player.x + cA * dist);
            let ty = Math.floor(player.y + sA * dist);
            if (worldMap[ty] && worldMap[ty][tx] > 0) hit = worldMap[ty][tx];
        }
        zBuffer[i] = dist * Math.cos(rayA - player.dir);
        let h = canvas.height / zBuffer[i];
        
        if (hit === 1) {
            if (gameMode === 'tdm') {
                let greenVal = Math.max(25, 100 - (dist * 4));
                ctx.strokeStyle = `rgb(15, ${greenVal}, 20)`;
            } else {
                let rValue = Math.max(10, 140 - (dist * 10));
                ctx.strokeStyle = `rgb(${rValue}, 12, 12)`;
            }
        } else if (hit === 3) {
            // Renders structural trunk pillars for forest objects
            let trunkDim = Math.max(15, 75 - (dist * 3));
            ctx.strokeStyle = `rgb(${trunkDim}, ${trunkDim * 0.6}, 15)`;
        } else {
            let greyValue = Math.max(8, 70 - (dist * 5));
            ctx.strokeStyle = `rgb(${greyValue}, ${greyValue}, ${greyValue})`;
        }
        ctx.beginPath(); ctx.moveTo(i, horizon - h/2); ctx.lineTo(i, horizon + h/2); ctx.stroke();
    }

    // Consolidated Billboard Rendering pipeline
    let sprites = [
        ...enemies.map(e => ({...e, type: 'enemy'})), 
        ...teammates.map(t => ({...t, type: 'teammate', scale: 0.95})),
        ...projectiles.map(p => ({...p, type: 'projectile', scale: 0.15})),
        ...grenades.map(g => ({...g, type: 'grenade', scale: 0.3})),
        ...environmentObjects.map(o => ({...o, type: 'tree_canopy', scale: 2.2}))
    ];
    sprites.sort((a,b) => Math.hypot(b.x-player.x, b.y-player.y) - Math.hypot(a.x-player.x, a.y-player.y));

    sprites.forEach(s => {
        let dx = s.x - player.x, dy = s.y - player.y;
        let dist = Math.hypot(dx, dy);
        let spriteAngle = Math.atan2(dy, dx) - player.dir;
        while(spriteAngle < -Math.PI) spriteAngle += Math.PI * 2;
        while(spriteAngle > Math.PI) spriteAngle -= Math.PI * 2;

        if (Math.abs(spriteAngle) < fov) {
            let spriteSize = (canvas.height / (dist * Math.cos(spriteAngle))) * (s.scale || 1);
            let xPos = (0.5 * (spriteAngle / (fov / 2)) + 0.5) * canvas.width;
            
            if (s.type === 'enemy') {
                const idx = enemies.findIndex(e => e.x === s.x && e.y === s.y);
                if (idx !== -1) { enemies[idx].renderX = xPos; enemies[idx].renderSize = spriteSize; }
            }

            if (dist < zBuffer[Math.floor(xPos)] + 0.8) {
                let hSlices = canvas.height / (dist * Math.cos(spriteAngle));
                let baseLine = horizon + hSlices / 2;

                if (s.type === 'enemy' || s.type === 'teammate') {
                    let collapseOffset = 0, scatter = 0;
                    if (s.isDying) {
                        let progress = (30 - s.deathTimer) / 30; 
                        collapseOffset = progress * (spriteSize * 0.4); 
                        scatter = progress * (spriteSize * 0.4);        
                    }

                    // System Skin Color configuration matrices
                    let armorColor = "#e0e0d5";
                    if (s.type === 'teammate') {
                        armorColor = s.hitFlash > 0 ? "#fff" : "#2a2b30"; // Gunmetal Black/Grey Core colors
                    } else {
                        armorColor = s.hitFlash > 0 ? "#fff" : (s.isBoss ? "#556255" : "#e0e0d5");
                    }
                    ctx.fillStyle = armorColor;

                    // Compute Frame Geometry blocks
                    ctx.fillRect(xPos - spriteSize/10 + (scatter * 0.2), baseLine - spriteSize * 0.95 + collapseOffset, spriteSize/5, spriteSize/6);
                    ctx.fillRect(xPos - spriteSize/14 + (scatter * 0.2), baseLine - spriteSize * 0.79 + collapseOffset, spriteSize/7, spriteSize/12);

                    // Sensor Optics configuration pass
                    ctx.fillStyle = s.type === 'teammate' ? "#31d7ff" : "#000";
                    ctx.fillRect(xPos - spriteSize/18, baseLine - spriteSize * 0.88 + collapseOffset, spriteSize/35, spriteSize/35); 
                    ctx.fillRect(xPos + spriteSize/35, baseLine - spriteSize * 0.88 + collapseOffset, spriteSize/35, spriteSize/35); 

                    // Core chassis plate elements
                    ctx.fillStyle = armorColor;
                    ctx.fillRect(xPos - spriteSize/35, baseLine - spriteSize * 0.7 + collapseOffset, spriteSize/17.5, spriteSize/2);
                    
                    // Layer horizontal rib scaffolding
                    ctx.fillRect(xPos - spriteSize/5 - scatter, baseLine - spriteSize * 0.7 + collapseOffset, spriteSize/2.5, spriteSize/35); 
                    ctx.fillRect(xPos - spriteSize/4.4 + scatter, baseLine - spriteSize * 0.61 + collapseOffset, spriteSize/2.25, spriteSize/35); 
                    
                    // Synthetic Armaments drawing logic 
                    ctx.save();
                    ctx.translate(xPos - spriteSize/6, baseLine - spriteSize * 0.55 + collapseOffset);
                    ctx.fillStyle = s.type === 'teammate' ? "#111" : "#1c1c1f";
                    ctx.fillRect(0, 0, spriteSize/4, spriteSize/15); // Rifle frame body assembly
                    ctx.fillStyle = "#050505";
                    ctx.fillRect(-spriteSize/4.3, 0, spriteSize/4, spriteSize/35);
                    ctx.restore();

                    // Kinetic Support Structs (Leg nodes)
                    let legSwing = s.isDying ? 0 : Math.sin(Date.now() * 0.01) * (spriteSize / 6);
                    ctx.fillRect(xPos - spriteSize/7 - scatter, baseLine - spriteSize * 0.23, spriteSize/45, spriteSize/4 + legSwing);
                    ctx.fillRect(xPos + spriteSize/9 + scatter, baseLine - spriteSize * 0.23, spriteSize/45, spriteSize/4 - legSwing);

                    // Health Interface Billboard render pass
                    if (!s.isDying) {
                        ctx.fillStyle = "#111"; ctx.fillRect(xPos - 30, baseLine - spriteSize * 1.12, 60, 5);
                        // Allied forces receive isolated Blue structural reads, hostiles get red/green scalings
                        ctx.fillStyle = s.type === 'teammate' ? "var(--regen-blue)" : (s.isBoss ? "#ff4500" : "#00ff41"); 
                        ctx.fillRect(xPos - 30, baseLine - spriteSize * 1.12, 60 * (s.health / s.maxHealth), 5);
                    }
                } else if (s.type === 'tree_canopy') {
                    // Procedural Foliage generation logic
                    ctx.fillStyle = "#1e4620";
                    ctx.beginPath();
                    ctx.moveTo(xPos, baseLine - spriteSize * 1.2);
                    ctx.lineTo(xPos - spriteSize * 0.45, baseLine - spriteSize * 0.3);
                    ctx.lineTo(xPos + spriteSize * 0.45, baseLine - spriteSize * 0.3);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = "#275c2a";
                    ctx.beginPath();
                    ctx.moveTo(xPos, baseLine - spriteSize * 1.4);
                    ctx.lineTo(xPos - spriteSize * 0.35, baseLine - spriteSize * 0.6);
                    ctx.lineTo(xPos + spriteSize * 0.35, baseLine - spriteSize * 0.6);
                    ctx.closePath();
                    ctx.fill();
                } else if (s.type === 'grenade') {
                    ctx.fillStyle = "#3a5f3a";
                    ctx.beginPath(); ctx.arc(xPos, horizon + (spriteSize * 0.8), spriteSize, 0, Math.PI * 2); ctx.fill();
                } else if (s.type === 'projectile') {
                    ctx.fillStyle = s.isTeammateProj ? "#00d2ff" : "#ffcc00";
                    ctx.beginPath(); ctx.arc(xPos, horizon, spriteSize, 0, Math.PI * 2); ctx.fill();
                }
            }
        }
    });

    drawMinimap();
}

btnUprising.addEventListener('click', (e) => { e.stopPropagation(); if (gameState === 'menu') selectDifficultyMode('uprising'); });
btnTDM.addEventListener('click', (e) => { e.stopPropagation(); if (gameState === 'menu') selectDifficultyMode('tdm'); });

// Screen interface click binding connections
document.getElementById('btn-diff-normal').addEventListener('click', (e) => { e.stopPropagation(); startNewGame('Normal'); });
document.getElementById('btn-diff-medium').addEventListener('click', (e) => { e.stopPropagation(); startNewGame('Medium'); });
document.getElementById('btn-diff-hard').addEventListener('click', (e) => { e.stopPropagation(); startNewGame('Hard'); });
document.getElementById('btn-diff-impossible').addEventListener('click', (e) => { e.stopPropagation(); startNewGame('Impossible'); });

document.getElementById('btn-tdm-normal').addEventListener('click', (e) => { e.stopPropagation(); startNewGame('Normal'); });
document.getElementById('btn-tdm-medium').addEventListener('click', (e) => { e.stopPropagation(); startNewGame('Medium'); });
document.getElementById('btn-tdm-hard').addEventListener('click', (e) => { e.stopPropagation(); startNewGame('Hard'); });
document.getElementById('btn-tdm-impossible').addEventListener('click', (e) => { e.stopPropagation(); startNewGame('Impossible'); });

document.addEventListener('mousedown', (e) => {
    if (gameState === 'over' || gameState === 'win') {
        returnToMainMenu();
    } else if (gameState === 'playing') {
        if (document.pointerLockElement === canvas) {
            if (player.currentWeapon === 'gun') {
                player.isHealing ? isFiringContinuous = false : isFiringContinuous = true; 
            } else {
                shoot(); 
            }
        } else {
            canvas.requestPointerLock();
        }
    }
});

document.addEventListener('mouseup', (e) => { if (gameState === 'playing') isFiringContinuous = false; });

document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === canvas && gameState === 'playing') {
        player.dir += e.movementX * 0.0025;
        player.pitch = Math.max(-200, Math.min(200, player.pitch - e.movementY * 0.8));
        if (!player.reloading && !player.isMeleeSwinging && !player.isHealing) {
            weaponWrap.style.transform = `translateX(-50%) translateY(${player.pitch * -0.15}px)`;
        }
    }
});

window.addEventListener('keydown', e => { 
    keys[e.code] = true; 
    if (gameState === 'playing') {
        if (e.code === 'KeyR') reload(); 
        if (e.code === 'KeyE') throwGrenade(); 
        if (e.code === 'Digit1') switchWeapon();
        if (e.code === 'Digit2') useMedkit();
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
