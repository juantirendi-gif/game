<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halisco: Boss Protocol - Mode Selection Menu</title>
    <style>
        :root {
            --tactical-green: #00ff41;
            --ui-bg: #050505;
            --damage-red: #ff3131;
            --damage-orange: #ff9900;
            --regen-blue: #31d7ff;
            --bone-white: #e0e0e0;
            --bloody-red: #990000;
        }

        body {
            margin: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--tactical-green);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            border: 2px solid #222;
            background: #000;
            overflow: hidden;
            width: 800px;
            height: 400px;
            cursor: default;
            transition: box-shadow 0.5s ease-in-out, border-color 0.5s;
        }

        #game-container.death-border {
            border-color: var(--damage-red) !important;
            box-shadow: 0 0 25px rgba(255, 49, 49, 0.6), inset 0 0 40px rgba(153, 0, 0, 0.5);
        }

        #damage-vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 40;
            box-shadow: inset 0 0px rgba(255, 0, 0, 0);
            transition: box-shadow 0.05s ease-out;
        }

        #damage-vignette.blood-pulse {
            box-shadow: inset 0 0 60px rgba(180, 0, 0, 0.85);
            transition: none;
        }

        canvas { display: block; }

        #menu-particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 101;
        }

        #top-right-hud {
            position: absolute;
            top: 15px;
            right: 15px;
            display: none;
            gap: 15px;
            z-index: 10;
            pointer-events: none;
            transform-origin: top right;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #top-right-hud.shrunk {
            transform: scale(0.8);
        }

        #hud-stats {
            background: rgba(5, 5, 5, 0.85);
            border: 2px solid #333;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            min-width: 150px;
            box-shadow: 0 0 10px rgba(0,0,0,0.7);
        }

        #minimap {
            width: 120px;
            height: 120px;
            border: 2px solid #333;
            background: rgba(5, 5, 5, 0.85);
            box-shadow: 0 0 10px rgba(0,0,0,0.7);
        }

        .hud-line {
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .hud-label {
            color: #666;
            text-transform: uppercase;
        }

        .hud-val {
            color: var(--tactical-green);
        }

        #bottom-left-hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: none;
            flex-direction: column;
            gap: 5px;
            z-index: 10;
            pointer-events: none;
            transform-origin: bottom left;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #bottom-left-hud.expanded {
            transform: scale(1.3);
        }

        .health-label {
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            text-shadow: 0 0 5px #000;
        }

        #health-bar-container {
            width: 200px;
            height: 14px;
            background: rgba(5, 5, 5, 0.75);
            border: 2px solid #444;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            overflow: hidden;
            transition: border-color 0.3s;
        }

        #health-bar-fill {
            width: 100%;
            height: 100%;
            background-color: var(--tactical-green);
            transition: width 0.1s ease-out, background-color 0.3s ease;
        }

        #bottom-right-hud {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: none;
            flex-direction: column;
            align-items: flex-end;
            z-index: 10;
            pointer-events: none;
            background: rgba(5, 5, 5, 0.85);
            border: 2px solid #333;
            padding: 8px 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.7);
            min-width: 130px;
        }

        .cooldown-label {
            font-size: 0.65rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        #cooldown-status {
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status-ready {
            color: var(--tactical-green);
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.5);
        }

        .status-charging {
            color: var(--damage-orange);
        }

        #center-reload-hud {
            position: absolute;
            top: 58%; 
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--damage-orange);
            text-shadow: 0 0 8px rgba(255, 153, 0, 0.6), 0 0 2px #000;
            display: none;
            pointer-events: none;
            z-index: 35;
        }

        #weapon-wrapper {
            position: absolute;
            bottom: -15px; left: 50%;
            transform: translateX(-50%);
            width: 240px; 
            pointer-events: none;
            z-index: 5;
            transition: transform 0.1s ease-out;
            display: none;
        }

        #muzzle-flash {
            position: absolute;
            top: 47%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px; height: 110px;
            background: radial-gradient(circle, #fff 0%, var(--tactical-green) 40%, transparent 70%);
            display: none;
            z-index: 4;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--tactical-green);
            font-size: 28px;
            pointer-events: none;
            z-index: 6;
            display: none;
        }

        #notification {
            position: absolute;
            top: 25%; left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 20px #000;
            z-index: 50;
            display: none;
            pointer-events: none;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15, 5, 5, 0.98) 0%, rgba(0, 0, 0, 0.99) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }

        #overlay h1 {
            font-size: 3.2rem;
            margin-top: 0;
            margin-bottom: 1rem;
            letter-spacing: 8px;
            color: #d1c7bd;
            text-shadow: 0 0 15px rgba(153, 0, 0, 0.8), 0 0 30px rgba(0, 0, 0, 0.9);
            font-weight: 900;
        }

        /* Tactical Stacked Menu Options */
        #menu-options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 105;
            width: 280px;
        }

        .menu-btn {
            background: rgba(10, 5, 5, 0.6);
            border: 1px solid #333;
            color: #888;
            padding: 10px 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .menu-btn.active-mode {
            color: var(--tactical-green);
            border-color: var(--tactical-green);
        }

        .menu-btn.active-mode:hover {
            background: rgba(0, 255, 65, 0.1);
            box-shadow: 0 0 12px rgba(0, 255, 65, 0.3);
            transform: scale(1.03);
        }

        .menu-btn.locked-mode {
            color: #444;
            border-color: #222;
            cursor: not-allowed;
        }

        #death-notice-sub {
            z-index: 105;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-shadow: 0 0 8px rgba(255, 49, 49, 0.4);
            color: var(--damage-red);
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .blink {
            animation: blinker 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes blinker { 50% { opacity: 0.15; } }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="damage-vignette"></div>

        <div id="notification">WAVE 1 ARRIVING</div>
        <div id="overlay">
            <canvas id="menu-particles" width="800" height="400"></canvas>
            <h1 id="overlay-title">HALISCO</h1>
            
            <div id="menu-options-container">
                <button class="menu-btn active-mode" id="btn-uprising">Uprising (waves)</button>
                <button class="menu-btn locked-mode" disabled>Team Deathmatch</button>
                <button class="menu-btn locked-mode" disabled>Settings</button>
            </div>

            <p id="death-notice-sub" class="blink">CLICK TO GO BACK TO THE MAIN MENU</p>
        </div>
        
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div id="top-right-hud">
            <div id="hud-stats">
                <div class="hud-line"><span class="hud-label">WAVE:</span><span id="hud-wave" class="hud-val">1/4</span></div>
                <div class="hud-line"><span class="hud-label">KILLS:</span><span id="hud-kills" class="hud-val">0</span></div>
                <div class="hud-line"><span class="hud-label">REMAINING:</span><span id="hud-remain" class="hud-val">10</span></div>
                <div class="hud-line"><span class="hud-label">AMMO:</span><span id="hud-ammo" class="hud-val">30/30</span></div>
            </div>
            <canvas id="minimap" width="120" height="120"></canvas>
        </div>

        <div id="bottom-left-hud">
            <div class="health-label">Armor Integrity <span id="health-text">100%</span></div>
            <div id="health-bar-container">
                <div id="health-bar-fill"></div>
            </div>
        </div>

        <div id="bottom-right-hud">
            <div class="cooldown-label">AUX WEAPON</div>
            <div id="cooldown-status" class="status-ready">GRENADE: READY</div>
        </div>

        <div id="center-reload-hud">Reloading...</div>

        <div id="muzzle-flash"></div>
        <div id="crosshair">⌖</div>
        
        <div id="weapon-wrapper">
            <svg id="weapon-svg" viewBox="0 0 200 200">
                <rect x="76" y="85" width="48" height="25" fill="#141416" stroke="#222" stroke-width="0.5" />
                <rect x="78" y="78" width="44" height="8" fill="#1c1c1f" />
                <rect x="80" y="73" width="40" height="5" fill="#0d0d0e" />
                <rect x="85" y="68" width="30" height="5" fill="#141416" />
                <rect x="88" y="73" width="4" height="5" fill="#000" />
                <rect x="108" y="73" width="4" height="5" fill="#000" />
                <rect x="94" y="38" width="12" height="40" fill="#1a1a1c" />
                <rect x="96" y="26" width="8" height="12" fill="#0b0b0c" />
                <polygon points="96,38 104,38 100,28" fill="#141416" />
                <circle cx="100" cy="45" r="2" fill="#00ff41" fill-opacity="0.6" />
                <rect x="88" y="52" width="24" height="26" fill="#18181a" rx="1" />
                <line x1="92" y1="55" x2="92" y2="75" stroke="#0d0d0e" stroke-width="1.5" />
                <line x1="100" y1="55" x2="100" y2="75" stroke="#0d0d0e" stroke-width="1.5" />
                <line x1="108" y1="55" x2="108" y2="75" stroke="#0d0d0e" stroke-width="1.5" />
                <rect x="90" y="110" width="18" height="35" fill="#111112" rx="1" transform="rotate(-5 99 110)" />
                <line x1="94" y1="115" x2="94" y2="140" stroke="#222" stroke-width="1" />
                <line x1="100" y1="115" x2="100" y2="140" stroke="#222" stroke-width="1" />
                <path d="M 76 90 L 62 135 L 86 135 Z" fill="#09090a" />
                <rect x="76" y="110" width="48" height="90" fill="#09090a" />
            </svg>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const mctx = minimapCanvas.getContext('2d');
const pCanvas = document.getElementById('menu-particles');
const pctx = pCanvas.getContext('2d');
const gameContainer = document.getElementById('game-container');
const weaponWrap = document.getElementById('weapon-wrapper');
const muzzle = document.getElementById('muzzle-flash');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const menuOptionsContainer = document.getElementById('menu-options-container');
const deathNoticeSub = document.getElementById('death-notice-sub');
const btnUprising = document.getElementById('btn-uprising');
const crosshair = document.getElementById('crosshair');
const notify = document.getElementById('notification');
const topHUD = document.getElementById('top-right-hud');
const bottomLeftHUD = document.getElementById('bottom-left-hud');
const bottomRightHUD = document.getElementById('bottom-right-hud');
const centerReloadHUD = document.getElementById('center-reload-hud');
const damageVignette = document.getElementById('damage-vignette');
const cooldownStatus = document.getElementById('cooldown-status');

let gameState = 'menu'; 
let worldMap = [];
let enemies = [];
let projectiles = [];
let grenades = []; 
let wave = 1;
let killsInWave = 0;
let enemiesSpawnedInWave = 0;
let screenShakeTime = 0;
let vignetteTimeout = null;
let menuAshArray = [];

const BASE_ENEMIES = 10;
const MAX_WAVES = 4;
const MAP_SIZE = 16;
const zBuffer = new Array(canvas.width);

let isFiringContinuous = false;
let lastAutoShotTime = 0;
const AUTO_FIRE_RATE = 100; 

const player = {
    x: 2.5, y: 2.5, dir: 0, pitch: 0,
    speed: 0.07, ammo: 30, reloading: false, health: 100,
    lastDamageTime: 0, 
    lastRegenTick: 0,
    lastGrenadeTime: 0,
    grenadeCooldown: 10000 
};

const keys = {};

function initMenuParticles() {
    menuAshArray = [];
    for(let i = 0; i < 40; i++) {
        menuAshArray.push({
            x: Math.random() * pCanvas.width,
            y: Math.random() * pCanvas.height + pCanvas.height,
            speed: 0.4 + Math.random() * 0.8,
            size: 1 + Math.random() * 2.5,
            drift: (Math.random() - 0.5) * 0.3,
            color: Math.random() > 0.6 ? 'rgba(140, 30, 30, 0.4)' : 'rgba(100, 100, 100, 0.3)'
        });
    }
}
initMenuParticles();

function handleMenuParticles() {
    if (gameState === 'playing') return;
    pctx.clearRect(0, 0, pCanvas.width, pCanvas.height);
    
    menuAshArray.forEach(p => {
        p.y -= p.speed;
        p.x += p.drift;
        if(p.y < -10) {
            p.y = pCanvas.height + 10;
            p.x = Math.random() * pCanvas.width;
        }
        pctx.fillStyle = p.color;
        pctx.fillRect(p.x, p.y, p.size, p.size);
    });
}

function getEnemiesForWave(w) {
    if (w === 4) return 1;
    return BASE_ENEMIES + ((w - 1) * 5);
}

function triggerVoice(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.rate = 1.1; 
    speech.pitch = 0.7; 
    speech.volume = 0.5;
    window.speechSynthesis.speak(speech);
}

function showNotification(text, color = "var(--tactical-green)") {
    notify.innerText = text;
    notify.style.color = color;
    notify.style.display = 'block';
    setTimeout(() => { notify.style.display = 'none'; }, 3000);
}

function returnToMainMenu() {
    gameContainer.classList.remove('death-border');
    gameContainer.style.cursor = 'default';
    gameState = 'menu';
    pCanvas.style.display = 'block';
    overlay.style.display = 'flex';
    
    menuOptionsContainer.style.display = 'flex';
    deathNoticeSub.style.display = 'none';

    overlayTitle.innerText = "HALISCO";
    overlayTitle.style.color = "#d1c7bd";
    overlayTitle.style.textShadow = "0 0 15px rgba(153, 0, 0, 0.8), 0 0 30px rgba(0, 0, 0, 0.9)";
}

function startNewGame() {
    gameContainer.style.cursor = 'pointer';
    wave = 1;
    killsInWave = 0;
    enemiesSpawnedInWave = 0;
    player.health = 100;
    player.ammo = 30;
    player.x = 2.5; player.y = 2.5;
    player.dir = 0;
    player.pitch = 0;
    player.lastDamageTime = Date.now();
    player.lastGrenadeTime = 0;
    enemies = [];
    projectiles = [];
    grenades = [];
    generateMap();
    startWave();
    gameState = 'playing';
    overlay.style.display = 'none';
    pCanvas.style.display = 'none';
    weaponWrap.style.display = 'block';
    crosshair.style.display = 'block';
    topHUD.style.display = 'flex';
    bottomLeftHUD.style.display = 'flex';
    bottomRightHUD.style.display = 'block';
    centerReloadHUD.style.display = 'none';
    
    canvas.requestPointerLock();
    updateUI();
}

function startWave() {
    killsInWave = 0;
    enemiesSpawnedInWave = 0;
    enemies = [];
    
    if (wave === 4) {
        showNotification("BOSS FIGHT", "var(--damage-red)");
        triggerVoice("Extreme threat detected. Boss fight initiated.");
        screenShakeTime = 300; 
        spawnEnemy(true);
    } else {
        showNotification(`WAVE ${wave} ARRIVING`);
        for(let i=0; i<6; i++) spawnEnemy();
    }
    updateUI();
}

function spawnEnemy(isBoss = false) {
    if (enemiesSpawnedInWave >= getEnemiesForWave(wave)) return;
    let ex, ey;
    do {
        ex = Math.random() * (MAP_SIZE - 2) + 1;
        ey = Math.random() * (MAP_SIZE - 2) + 1;
    } while (worldMap[Math.floor(ey)][Math.floor(ex)] !== 0 || Math.hypot(ex-player.x, ey-player.y) < 5);
    
    let isMelee = !isBoss && (Math.random() < 0.25);

    enemies.push({ 
        x: ex, y: ey, 
        health: isBoss ? 1000 : 100, 
        maxHealth: isBoss ? 1000 : 100,
        lastShot: Date.now() + (Math.random() * 2000), 
        hitFlash: 0, 
        isFiring: false,
        isBoss: isBoss,
        isMelee: isMelee,
        swingTime: 0,
        isDying: false,       
        deathTimer: 0,        
        scale: isBoss ? 2.0 : 1.0 
    });
    enemiesSpawnedInWave++;
}

function updateUI() {
    const healthPercent = Math.max(0, Math.floor(player.health));
    const healthBarFill = document.getElementById('health-bar-fill');
    const healthBarContainer = document.getElementById('health-bar-container');
    const healthText = document.getElementById('health-text');
    
    healthBarFill.style.width = healthPercent + "%";
    healthText.innerText = healthPercent + "%";

    const isRegenerating = (Date.now() - player.lastDamageTime > 6000 && player.health < 100);

    if (healthPercent >= 60) {
        healthBarFill.style.backgroundColor = "var(--tactical-green)";
        healthText.style.color = "var(--tactical-green)";
    } else if (healthPercent >= 30) {
        healthBarFill.style.backgroundColor = "var(--damage-orange)";
        healthText.style.color = "var(--damage-orange)";
    } else {
        healthBarFill.style.backgroundColor = "var(--damage-red)";
        healthText.style.color = "var(--damage-red)";
    }

    if (healthPercent < 50) {
        bottomLeftHUD.classList.add('expanded');
        topHUD.classList.add('shrunk');
    } else {
        bottomLeftHUD.classList.remove('expanded');
        topHUD.classList.remove('shrunk');
    }

    if (isRegenerating) {
        healthBarContainer.style.borderColor = "var(--regen-blue)";
    } else {
        healthBarContainer.style.borderColor = "#444";
    }

    let remainingSkeletons = getEnemiesForWave(wave) - killsInWave;

    document.getElementById('hud-ammo').innerText = `${player.ammo}/30`;
    document.getElementById('hud-wave').innerText = `${wave}/${MAX_WAVES}`;
    document.getElementById('hud-kills').innerText = killsInWave;
    document.getElementById('hud-remain').innerText = Math.max(0, remainingSkeletons);
    
    updateGrenadeHUD();
}

function updateGrenadeHUD() {
    const now = Date.now();
    const timeElapsed = now - player.lastGrenadeTime;
    
    if (timeElapsed < player.grenadeCooldown) {
        const timeLeft = ((player.grenadeCooldown - timeElapsed) / 1000).toFixed(1);
        cooldownStatus.innerText = `GRENADE: ${timeLeft}s`;
        cooldownStatus.className = "status-charging";
    } else {
        cooldownStatus.innerText = "GRENADE: READY";
        cooldownStatus.className = "status-ready";
    }
}

function registerPlayerDamage(amount) {
    player.health -= amount;
    player.lastDamageTime = Date.now();
    
    if (player.health < 50) {
        damageVignette.classList.remove('blood-pulse');
        void damageVignette.offsetWidth; 
        damageVignette.classList.add('blood-pulse');
        
        clearTimeout(vignetteTimeout);
        vignetteTimeout = setTimeout(() => {
            damageVignette.classList.remove('blood-pulse');
        }, 50); 
    }

    updateUI();
    checkGameOver();
}

function handleRegeneration() {
    const now = Date.now();
    if (now - player.lastDamageTime > 6000) {
        if (player.health < 100 && now - player.lastRegenTick > 1000) {
            player.health = Math.min(100, player.health + 5); 
            player.lastRegenTick = now;
            updateUI();
        }
    }
}

function checkGameOver() {
    if (player.health <= 0) {
        gameState = 'over';
        isFiringContinuous = false;
        document.exitPointerLock();
        
        gameContainer.classList.add('death-border');
        gameContainer.style.cursor = 'pointer';

        overlay.style.display = 'flex';
        topHUD.style.display = 'none';
        bottomLeftHUD.style.display = 'none';
        bottomRightHUD.style.display = 'none';
        centerReloadHUD.style.display = 'none';
        
        // Dynamic Swap: Hide setup menu options, show death confirmation prompt instead
        menuOptionsContainer.style.display = 'none';
        deathNoticeSub.style.display = 'block';
        deathNoticeSub.innerText = "click to go back to the main menu";

        overlayTitle.innerText = "You're dead";
        overlayTitle.style.color = "var(--damage-red)";
        overlayTitle.style.textShadow = "0 0 15px rgba(255, 0, 0, 0.7)";
    }
}

function reload() {
    if (player.reloading || player.ammo === 30) return;
    player.reloading = true;
    isFiringContinuous = false; 
    triggerVoice("Reloading");
    
    centerReloadHUD.style.display = 'block';

    const startPitch = player.pitch * -0.15;
    weaponWrap.style.transition = "transform 0.3s ease-in";
    weaponWrap.style.transform = `translateX(-50%) translateY(${300 + startPitch}px) rotate(15deg)`;
    setTimeout(() => {
        weaponWrap.style.transform = `translateX(-50%) translateY(${280 + startPitch}px) rotate(-5deg)`;
        setTimeout(() => {
            player.ammo = 30;
            
            centerReloadHUD.style.display = 'none';

            updateUI();
            const endPitch = player.pitch * -0.15;
            weaponWrap.style.transition = "transform 0.2s ease-out";
            weaponWrap.style.transform = `translateX(-50%) translateY(${endPitch}px) rotate(0deg)`;
            setTimeout(() => {
                weaponWrap.style.transition = "transform 0.1s ease-out";
                player.reloading = false;
            }, 200);
        }, 400);
    }, 300);
}

function shoot() {
    if (player.ammo <= 0) {
        isFiringContinuous = false;
        reload();
        return;
    }
    if (player.reloading) return;

    player.ammo--;
    updateUI();
    
    player.pitch += 6; 
    
    const currentPitchOffset = player.pitch * -0.15;
    weaponWrap.style.transition = "none";
    weaponWrap.style.transform = `translateX(-50%) translateY(${currentPitchOffset + 10}px) scale(1.03)`;
    setTimeout(() => {
        weaponWrap.style.transition = "transform 0.05s ease-out";
        weaponWrap.style.transform = `translateX(-50%) translateY(${player.pitch * -0.15}px) scale(1)`;
    }, 30);

    muzzle.style.display = 'block';
    setTimeout(() => muzzle.style.display = 'none', 30);

    enemies.forEach(en => {
        if (en.isDying) return; 

        let dx = en.x - player.x, dy = en.y - player.y;
        let angleToEn = Math.atan2(dy, dx);
        let angleDiff = angleToEn - player.dir;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        
        let dist = Math.hypot(dx, dy);
        let hitBox = en.isBoss ? 0.4 : 0.15; 
        if (Math.abs(angleDiff) < hitBox && dist < 15) {
            let clearShot = true;
            for(let d=0; d<dist; d+=0.2) {
                if(worldMap[Math.floor(player.y + Math.sin(angleToEn)*d)][Math.floor(player.x + Math.cos(angleToEn)*d)] > 0) {
                    clearShot = false; break;
                }
            }
            if(clearShot) {
                en.health -= 25; 
                en.hitFlash = 3;
                if(en.health <= 0) { 
                    en.isDying = true;
                    en.deathTimer = 30; 
                    killsInWave++; 
                    updateUI();
                    checkWaveProgress();
                }
            }
        }
    });
}

function throwGrenade() {
    const now = Date.now();
    if (now - player.lastGrenadeTime < player.grenadeCooldown) return; 

    player.lastGrenadeTime = now;
    
    const launchForce = 0.12;
    grenades.push({
        x: player.x,
        y: player.y,
        vx: Math.cos(player.dir) * launchForce,
        vy: Math.sin(player.dir) * launchForce,
        life: 45 
    });
    
    updateUI();
}

function processExplosion(gx, gy) {
    screenShakeTime = 25; 
    const blastRadius = 3.0;
    
    const playerDist = Math.hypot(player.x - gx, player.y - gy);
    if (playerDist <= blastRadius) {
        const damagePercentage = 1.0 - (playerDist / blastRadius);
        const playerDamage = Math.floor(damagePercentage * 60); 
        if (playerDamage > 5) registerPlayerDamage(playerDamage);
    }

    enemies.forEach(en => {
        if (en.isDying) return;
        const enemyDist = Math.hypot(en.x - gx, en.y - gy);
        if (enemyDist <= blastRadius) {
            const damagePercentage = 1.0 - (enemyDist / blastRadius);
            const explosiveDamage = Math.floor(damagePercentage * 250); 
            
            if (explosiveDamage > 10) {
                en.health -= explosiveDamage;
                en.hitFlash = 5;
                if (en.health <= 0) {
                    en.isDying = true;
                    en.deathTimer = 30;
                    killsInWave++;
                    updateUI();
                    checkWaveProgress();
                }
            }
        }
    });
}

function checkWaveProgress() {
    if (killsInWave >= getEnemiesForWave(wave)) {
        if (wave < MAX_WAVES) {
            showNotification(`WAVE ${wave} COMPLETE`, "#fff");
            wave++;
            setTimeout(startWave, 2000);
        } else {
            gameState = 'win';
            isFiringContinuous = false;
            document.exitPointerLock();
            overlay.style.display = 'flex';
            topHUD.style.display = 'none';
            bottomLeftHUD.style.display = 'none';
            bottomRightHUD.style.display = 'none';
            centerReloadHUD.style.display = 'none';
            
            menuOptionsContainer.style.display = 'none';
            deathNoticeSub.style.display = 'block';
            deathNoticeSub.innerText = "CLICK TO GO BACK TO THE MAIN MENU";

            overlayTitle.innerText = "MISSION SUCCESS";
            overlayTitle.style.color = "var(--tactical-green)";
        }
    }
}

function generateMap() {
    worldMap = Array.from({length: MAP_SIZE}, () => Array(MAP_SIZE).fill(0));
    for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
            if (x === 0 || x === MAP_SIZE-1 || y === 0 || y === MAP_SIZE-1) worldMap[y][x] = 1;
            else if (Math.random() < 0.15) worldMap[y][x] = Math.random() > 0.5 ? 1 : 2;
        }
    }
    worldMap[2][2] = 0; worldMap[3][2] = 0; worldMap[2][3] = 0;
}

function update() {
    handleMenuParticles();
    if (gameState !== 'playing') return;
    
    handleRegeneration();
    updateGrenadeHUD();

    if (isFiringContinuous && !player.reloading) {
        const now = Date.now();
        if (now - lastAutoShotTime >= AUTO_FIRE_RATE) {
            shoot();
            lastAutoShotTime = now;
        }
    }

    if (player.pitch > 0) player.pitch *= 0.85; 
    if (player.pitch < 0) player.pitch *= 0.85;

    if (screenShakeTime > 0) {
        screenShakeTime--;
        canvas.style.transform = `translate(${(Math.random()-0.5)*12}px, ${(Math.random()-0.5)*12}px)`;
    } else {
        canvas.style.transform = `translate(0,0)`;
    }

    let mx = 0, my = 0;
    if (keys['KeyW']) { mx += Math.cos(player.dir) * player.speed; my += Math.sin(player.dir) * player.speed; }
    if (keys['KeyS']) { mx -= Math.cos(player.dir) * player.speed; my -= Math.sin(player.dir) * player.speed; }
    if (keys['KeyA']) { mx += Math.cos(player.dir - 1.57) * player.speed; my += Math.sin(player.dir - 1.57) * player.speed; }
    if (keys['KeyD']) { mx += Math.cos(player.dir + 1.57) * player.speed; my += Math.sin(player.dir + 1.57) * player.speed; }

    if (worldMap[Math.floor(player.y)][Math.floor(player.x + mx)] === 0) player.x += mx;
    if (worldMap[Math.floor(player.y + my)][Math.floor(player.x)] === 0) player.y += my;

    for (let i = grenades.length - 1; i >= 0; i--) {
        let g = grenades[i];
        let nex = g.x + g.vx;
        let ney = g.y + g.vy;
        
        if (worldMap[Math.floor(g.y)][Math.floor(nex)] > 0) { g.vx *= -0.6; nex = g.x; }
        if (worldMap[Math.floor(ney)][Math.floor(g.x)] > 0) { g.vy *= -0.6; ney = g.y; }
        
        g.x = nex; g.y = ney;
        g.vx *= 0.95; g.vy *= 0.95; 
        
        g.life--;
        if (g.life <= 0) {
            processExplosion(g.x, g.y);
            grenades.splice(i, 1);
        }
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.vx; p.y += p.vy;
        if (worldMap[Math.floor(p.y)][Math.floor(p.x)] > 0) { projectiles.splice(i, 1); continue; }
        if (Math.hypot(p.x - player.x, p.y - player.y) < 0.3) {
            projectiles.splice(i, 1);
            registerPlayerDamage(10);
            continue;
        }
        p.life--;
        if (p.life <= 0) projectiles.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        
        if (en.isDying) {
            en.deathTimer--;
            if (en.deathTimer <= 0) {
                enemies.splice(i, 1);
                if (wave < 4) while(enemies.filter(e => !e.isDying).length < 6 && enemiesSpawnedInWave < getEnemiesForWave(wave)) spawnEnemy();
            }
            continue;
        }

        let dist = Math.hypot(player.x - en.x, player.y - en.y);
        if (en.hitFlash > 0) en.hitFlash--;
        if (en.swingTime > 0) en.swingTime--;

        let ang = Math.atan2(player.y - en.y, player.x - en.x);
        let speed = en.isBoss ? 0.015 : (en.isMelee ? 0.025 : 0.02);
        
        if (dist > 1.0) {
            let nex = en.x + Math.cos(ang) * speed;
            let ney = en.y + Math.sin(ang) * speed;
            
            if (worldMap[Math.floor(en.y)][Math.floor(nex)] === 0) {
                en.x = nex;
            }
            if (worldMap[Math.floor(ney)][Math.floor(en.x)] === 0) {
                en.y = ney;
            }
        }

        if (en.isMelee) {
            if (dist <= 1.2 && Date.now() - en.lastShot > 1500) {
                en.swingTime = 20; 
                en.lastShot = Date.now();
                screenShakeTime = 10;
                registerPlayerDamage(15);
            }
        } else {
            let fireRate = en.isBoss ? 800 : (3000 - (wave * 200));
            if (Date.now() - en.lastShot > fireRate) {
                en.isFiring = true;
                en.lastShot = Date.now();
                projectiles.push({
                    x: en.x, y: en.y,
                    vx: Math.cos(ang) * 0.15, vy: Math.sin(ang) * 0.15,
                    life: 150
                });
                setTimeout(() => en.isFiring = false, 150);
            }
        }
    }
}

function drawMinimap() {
    mctx.fillStyle = "rgba(5, 5, 5, 0.85)";
    mctx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

    const cellSize = minimapCanvas.width / MAP_SIZE;

    mctx.fillStyle = "#222a22";
    for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
            if (worldMap[y][x] > 0) {
                mctx.fillRect(x * cellSize, y * cellSize, cellSize - 0.5, cellSize - 0.5);
            }
        }
    }

    grenades.forEach(g => {
        mctx.fillStyle = "#ffaa00";
        mctx.fillRect(g.x * cellSize - 2, g.y * cellSize - 2, 4, 4);
    });

    enemies.forEach(en => {
        if (en.isDying) return; 
        mctx.fillStyle = en.isBoss ? "#ff3131" : "#ff5c5c";
        mctx.beginPath();
        let r = en.isBoss ? 4 : 2.5;
        mctx.arc(en.x * cellSize, en.y * cellSize, r, 0, Math.PI * 2);
        mctx.fill();
    });

    const px = player.x * cellSize;
    const py = player.y * cellSize;

    mctx.strokeStyle = "rgba(0, 255, 65, 0.4)";
    mctx.lineWidth = 1.5;
    mctx.beginPath();
    mctx.moveTo(px, py);
    mctx.lineTo(px + Math.cos(player.dir) * 15, py + Math.sin(player.dir) * 15);
    mctx.stroke();

    mctx.fillStyle = "var(--tactical-green)";
    mctx.beginPath();
    mctx.arc(px, py, 3.5, 0, Math.PI * 2);
    mctx.fill();
}

function draw() {
    if (gameState === 'menu') return;
    const horizon = 200 + player.pitch;
    ctx.fillStyle = "#111"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#1a2a3a"; ctx.fillRect(0, 0, canvas.width, horizon);

    const fov = 1.1;
    for (let i = 0; i < canvas.width; i++) {
        let rayA = (player.dir - fov/2) + (i / canvas.width) * fov;
        let dist = 0, hit = 0;
        let cA = Math.cos(rayA), sA = Math.sin(rayA);
        while (hit === 0 && dist < 16) {
            dist += 0.05;
            let tx = Math.floor(player.x + cA * dist);
            let ty = Math.floor(player.y + sA * dist);
            if (worldMap[ty] && worldMap[ty][tx] > 0) hit = worldMap[ty][tx];
        }
        zBuffer[i] = dist * Math.cos(rayA - player.dir);
        let h = canvas.height / zBuffer[i];
        let b = Math.max(0, 180 - (dist * 12));
        ctx.strokeStyle = (hit === 1) ? `rgb(${b},${b},${b})` : `rgb(0,${b},0)`;
        ctx.beginPath(); ctx.moveTo(i, horizon - h/2); ctx.lineTo(i, horizon + h/2); ctx.stroke();
    }

    let sprites = [
        ...enemies.map(e => ({...e, type: 'enemy'})), 
        ...projectiles.map(p => ({...p, type: 'projectile'})),
        ...grenades.map(g => ({...g, type: 'grenade', scale: 0.3}))
    ];
    sprites.sort((a,b) => Math.hypot(b.x-player.x, b.y-player.y) - Math.hypot(a.x-player.x, a.y-player.y));

    sprites.forEach(s => {
        let dx = s.x - player.x, dy = s.y - player.y;
        let dist = Math.hypot(dx, dy);
        let spriteAngle = Math.atan2(dy, dx) - player.dir;
        while(spriteAngle < -Math.PI) spriteAngle += Math.PI * 2;
        while(spriteAngle > Math.PI) spriteAngle -= Math.PI * 2;

        if (Math.abs(spriteAngle) < fov) {
            let spriteSize = (canvas.height / (dist * Math.cos(spriteAngle))) * (s.scale || 1);
            let xPos = (0.5 * (spriteAngle / (fov / 2)) + 0.5) * canvas.width;
            
            if (dist < zBuffer[Math.floor(xPos)] + 0.5) {
                if (s.type === 'enemy') {
                    let hSlices = canvas.height / (dist * Math.cos(spriteAngle));
                    let footLine = horizon + hSlices / 2;
                    let baseLine = footLine; 

                    let collapseOffset = 0;
                    let scatter = 0;
                    if (s.isDying) {
                        let progress = (30 - s.deathTimer) / 30; 
                        collapseOffset = progress * (spriteSize * 0.4); 
                        scatter = progress * (spriteSize * 0.4);        
                    }

                    if (s.isBoss && !s.isDying) {
                        ctx.fillStyle = `rgba(230, ${60 + Math.random()*100}, 0, 0.5)`;
                        for(let f=0; f<12; f++) {
                            ctx.fillRect(xPos - spriteSize/2.2 + Math.random()*spriteSize/1.1, baseLine - spriteSize * 1.2 - Math.random()*40, spriteSize/12, spriteSize/4);
                        }
                    }

                    let boneColor = s.hitFlash > 0 ? "#fff" : (s.isBoss ? "#556255" : "#e0e0d5");
                    ctx.fillStyle = boneColor;

                    ctx.fillRect(xPos - spriteSize/10 + (scatter * 0.2), baseLine - spriteSize * 0.95 + collapseOffset - (scatter * 0.1), spriteSize/5, spriteSize/6);
                    ctx.fillRect(xPos - spriteSize/14 + (scatter * 0.2), baseLine - spriteSize * 0.79 + collapseOffset - (scatter * 0.1), spriteSize/7, spriteSize/12);

                    ctx.fillStyle = "#000";
                    ctx.fillRect(xPos - spriteSize/18 + (scatter * 0.2), baseLine - spriteSize * 0.88 + collapseOffset - (scatter * 0.1), spriteSize/35, spriteSize/35); 
                    ctx.fillRect(xPos + spriteSize/35 + (scatter * 0.2), baseLine - spriteSize * 0.88 + collapseOffset - (scatter * 0.1), spriteSize/35, spriteSize/35); 
                    ctx.fillRect(xPos - spriteSize/120 + (scatter * 0.2), baseLine - spriteSize * 0.83 + collapseOffset - (scatter * 0.1), spriteSize/60, spriteSize/40); 

                    ctx.fillStyle = boneColor;
                    ctx.fillRect(xPos - spriteSize/35, baseLine - spriteSize * 0.7 + collapseOffset, spriteSize/17.5, spriteSize/2);
                    
                    ctx.fillRect(xPos - spriteSize/5 - scatter, baseLine - spriteSize * 0.7 + collapseOffset, spriteSize/2.5, spriteSize/35); 
                    ctx.fillRect(xPos - spriteSize/4.5 + scatter, baseLine - spriteSize * 0.61 + collapseOffset, spriteSize/2.25, spriteSize/35); 
                    ctx.fillRect(xPos - spriteSize/5 - (scatter * 0.5), baseLine - spriteSize * 0.55 + collapseOffset, spriteSize/2.5, spriteSize/35); 
                    ctx.fillRect(xPos - spriteSize/6 + (scatter * 0.5), baseLine - spriteSize * 0.49 + collapseOffset, spriteSize/3, spriteSize/35); 

                    let legSwing = s.isDying ? 0 : Math.sin(Date.now() * 0.01) * (spriteSize / 6);
                    ctx.fillRect(xPos - spriteSize/7 - scatter, baseLine - spriteSize * 0.23 + (collapseOffset * 0.5), spriteSize/45, spriteSize/4 + legSwing);
                    ctx.fillRect(xPos + spriteSize/9 + scatter, baseLine - spriteSize * 0.23 + (collapseOffset * 0.5), spriteSize/45, spriteSize/4 - legSwing);

                    if (s.isMelee) {
                        ctx.save();
                        ctx.translate(xPos - spriteSize/6 - (scatter * 0.8), baseLine - spriteSize * 0.5 + collapseOffset);
                        
                        let swingArc = 0;
                        if (s.isDying) {
                            swingArc = ((30 - s.deathTimer) / 30) * 2.5; 
                        } else if (s.swingTime > 0) {
                            swingArc = Math.sin((s.swingTime / 20) * Math.PI) * -1.5;
                        }
                        ctx.rotate(swingArc);

                        ctx.fillStyle = "#8a9597"; 
                        ctx.fillRect(-spriteSize/45, -spriteSize/2.2, spriteSize/30, spriteSize/2.2);
                        ctx.fillStyle = "#b5a642"; 
                        ctx.fillRect(-spriteSize/15, -spriteSize/35, spriteSize/6, spriteSize/45);
                        ctx.fillStyle = "#5c4033"; 
                        ctx.fillRect(-spriteSize/70, 0, spriteSize/50, spriteSize/10);
                        ctx.restore();

                        ctx.fillStyle = boneColor;
                        ctx.fillRect(xPos - spriteSize/5 - scatter, baseLine - spriteSize * 0.57 + collapseOffset, spriteSize/45, spriteSize/6);
                    } else {
                        ctx.save();
                        ctx.translate(xPos - spriteSize/6, baseLine - spriteSize * 0.55 + collapseOffset);
                        if (s.isDying) ctx.rotate(((30 - s.deathTimer) / 30) * -1.8);

                        ctx.fillStyle = "#1c1c1f"; 
                        ctx.fillRect(0, 0, spriteSize/4, spriteSize/15); 
                        ctx.fillStyle = "#0d0d0e"; 
                        ctx.fillRect(-spriteSize/4.3, 0, spriteSize/4, spriteSize/35);
                        ctx.fillStyle = "#111112"; 
                        ctx.fillRect(0, spriteSize/25, spriteSize/25, spriteSize/12);
                        if (!s.isDying) {
                            ctx.fillStyle = "rgba(0, 255, 65, 0.7)"; 
                            ctx.fillRect(spriteSize/15, -spriteSize/25, spriteSize/40, spriteSize/50);
                        }
                        ctx.restore();

                        ctx.fillStyle = boneColor;
                        ctx.fillRect(xPos - spriteSize/5 - scatter, baseLine - spriteSize * 0.57 + collapseOffset, spriteSize/45, spriteSize/6);
                        ctx.fillRect(xPos + spriteSize/15 + scatter, baseLine - spriteSize * 0.49 + collapseOffset, spriteSize/45, spriteSize/6);
                    }

                    if (!s.isDying) {
                        ctx.fillStyle = "#333"; ctx.fillRect(xPos - 40, baseLine - spriteSize * 1.15, 80, 6);
                        ctx.fillStyle = s.isBoss ? "#ff4500" : "#00ff41"; 
                        ctx.fillRect(xPos - 40, baseLine - spriteSize * 1.15, 80 * (s.health / s.maxHealth), 6);
                    }
                } else if (s.type === 'grenade') {
                    ctx.fillStyle = "#3a5f3a";
                    ctx.beginPath();
                    ctx.arc(xPos, horizon + (spriteSize * 0.8), spriteSize, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = (Math.floor(Date.now() / 100) % 2 === 0) ? "#ff3131" : "#000";
                    ctx.beginPath();
                    ctx.arc(xPos, horizon + (spriteSize * 0.8), spriteSize * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = "#ff0";
                    ctx.beginPath(); ctx.arc(xPos, horizon, spriteSize/10, 0, Math.PI * 2); ctx.fill();
                }
            }
        }
    });

    drawMinimap();
}

// Option Interaction Routing
btnUprising.addEventListener('click', (e) => {
    e.stopPropagation(); // Block backdrop selection tracking
    if (gameState === 'menu') {
        startNewGame();
    }
});

document.addEventListener('mousedown', (e) => {
    if (gameState === 'over' || gameState === 'win') {
        returnToMainMenu();
    } else if (gameState === 'playing') {
        if (document.pointerLockElement === canvas) {
            isFiringContinuous = true; 
        } else {
            canvas.requestPointerLock();
        }
    }
});

document.addEventListener('mouseup', (e) => {
    if (gameState === 'playing') {
        isFiringContinuous = false; 
    }
});

document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === canvas && gameState === 'playing') {
        player.dir += e.movementX * 0.0025;
        player.pitch = Math.max(-150, Math.min(150, player.pitch - e.movementY * 0.8));
        if (!player.reloading) weaponWrap.style.transform = `translateX(-50%) translateY(${player.pitch * -0.15}px)`;
    }
});

window.addEventListener('keydown', e => { 
    keys[e.code] = true; 
    if (gameState === 'playing') {
        if (e.code === 'KeyR') reload(); 
        if (e.code === 'KeyE') throwGrenade(); 
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
