<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halisco: Boss Protocol - Fullscreen Edition</title>
    <style>
        :root {
            --tactical-green: #00ff41;
            --ui-bg: #050505;
            --damage-red: #ff3131;
            --damage-orange: #ff9900;
            --regen-blue: #31d7ff;
            --bone-white: #e0e0e0;
            --bloody-red: #990000;
            --glove-base: #1c1c1f;
            --glove-plate: #2d2e33;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            color: var(--tactical-green);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            cursor: default;
            transition: box-shadow 0.5s ease-in-out;
        }

        #game-container.death-border {
            box-shadow: inset 0 0 50px rgba(153, 0, 0, 0.8);
        }

        #damage-vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 40;
            box-shadow: inset 0 0px rgba(255, 0, 0, 0);
            transition: box-shadow 0.05s ease-out;
        }

        #damage-vignette.blood-pulse {
            box-shadow: inset 0 0 100px rgba(180, 0, 0, 0.95);
            transition: none;
        }

        #heal-flash-vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 41;
            opacity: 0;
            box-shadow: inset 0 0 80px rgba(0, 255, 65, 0.85);
        }

        @keyframes healPulse {
            0% { opacity: 0; box-shadow: inset 0 0 40px rgba(0, 255, 65, 0.4); }
            25% { opacity: 1; box-shadow: inset 0 0 100px rgba(0, 255, 65, 0.95); }
            50% { opacity: 0.3; box-shadow: inset 0 0 50px rgba(0, 255, 65, 0.5); }
            75% { opacity: 0.9; box-shadow: inset 0 0 90px rgba(0, 255, 65, 0.85); }
            100% { opacity: 0; box-shadow: inset 0 0 0px rgba(0, 255, 65, 0); }
        }

        .healing-flash-active {
            animation: healPulse 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        canvas#gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #menu-particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 101;
        }

        #top-right-hud {
            position: absolute;
            top: 30px;
            right: 30px;
            display: none;
            gap: 25px;
            z-index: 10;
            pointer-events: none;
            transform-origin: top right;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #top-right-hud.shrunk {
            transform: scale(0.95);
        }

        #hud-stats {
            background: rgba(5, 5, 5, 0.85);
            border: 2px solid #333;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            min-width: 240px;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        #minimap {
            width: 180px;
            height: 180px;
            border: 2px solid #333;
            background: rgba(5, 5, 5, 0.85);
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        .hud-line {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .hud-label {
            color: #666;
            text-transform: uppercase;
        }

        .hud-val {
            color: var(--tactical-green);
        }

        #bottom-left-hud {
            position: absolute;
            bottom: 35px;
            left: 35px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            pointer-events: none;
            transform-origin: bottom left;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #bottom-left-hud.expanded {
            transform: scale(1.35);
        }

        .health-label {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            text-shadow: 0 0 5px #000;
        }

        #health-bar-container {
            width: 320px;
            height: 22px;
            background: rgba(5, 5, 5, 0.75);
            border: 2px solid #444;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            overflow: hidden;
            transition: border-color 0.3s;
        }

        #health-bar-fill {
            width: 100%;
            height: 100%;
            background-color: var(--tactical-green);
            transition: width 0.1s ease-out, background-color 0.3s ease;
        }

        #bottom-right-hud {
            position: absolute;
            bottom: 35px;
            right: 35px;
            display: none;
            flex-direction: column;
            align-items: flex-end;
            z-index: 10;
            pointer-events: none;
            background: rgba(5, 5, 5, 0.85);
            border: 2px solid #333;
            padding: 14px 22px;
            box-shadow: 0 0 10px rgba(0,0,0,0.7);
            min-width: 200px;
        }

        .cooldown-label {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        #cooldown-status {
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #bottom-middle-hud {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 10;
            pointer-events: none;
            display: flex;
            gap: 15px;
        }

        .hud-circle-wrapper {
            position: relative;
            width: 65px;
            height: 65px;
        }

        .hud-circle-container {
            width: 100%;
            height: 100%;
            border: 2px solid var(--tactical-green);
            border-radius: 50%;
            background: rgba(15, 15, 15, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(0, 255, 65, 0.25);
            overflow: hidden;
        }

        .hud-circle-container svg {
            width: 95%;
            height: 95%;
        }

        .hud-hotkey-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #050505;
            border: 1.5px solid var(--tactical-green);
            color: var(--tactical-green);
            font-size: 0.75rem;
            font-weight: bold;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 6px rgba(0, 255, 65, 0.4);
            z-index: 12;
        }

        .cooldown-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--damage-orange);
            font-weight: bold;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 11;
        }

        .cooldown-overlay.active {
            opacity: 1;
        }

        .status-ready {
            color: var(--tactical-green);
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.5);
        }

        .status-charging {
            color: var(--damage-orange);
        }

        #center-reload-hud {
            position: absolute;
            top: 58%; 
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--damage-orange);
            text-shadow: 0 0 8px rgba(255, 153, 0, 0.6), 0 0 2px #000;
            display: none;
            pointer-events: none;
            z-index: 35;
        }

        #weapon-wrapper {
            position: absolute;
            bottom: -35px; left: 50%;
            transform: translateX(-50%);
            width: 450px; 
            pointer-events: none;
            z-index: 5;
            transition: transform 0.1s ease-out;
            display: none;
        }

        #grenade-arm-wrapper {
            position: absolute;
            bottom: -380px; 
            left: -50px;
            width: 400px;
            height: 400px;
            pointer-events: none;
            z-index: 6;
            transform: rotate(25deg);
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), bottom 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            display: none;
        }

        #grenade-arm-wrapper.throwing {
            bottom: -60px;
            left: 60px;
            transform: rotate(-15deg) scale(1.1);
        }

        #medkit-use-wrapper {
            position: absolute;
            bottom: -350px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 320px;
            pointer-events: none;
            z-index: 7;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1), bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            display: none;
        }

        #medkit-use-wrapper.using {
            bottom: -20px;
            transform: translateX(-50%) scale(1.05);
        }

        #medkit-use-wrapper.healing-shake {
            animation: medkitWobble 0.8s ease-in-out infinite alternate;
        }

        @keyframes medkitWobble {
            0% { transform: translateX(-50%) translateY(0) rotate(0deg); }
            50% { transform: translateX(-48%) translateY(-5px) rotate(2deg); }
            100% { transform: translateX(-52%) translateY(3px) rotate(-2deg); }
        }

        .machete-blade {
            fill: #8a9597;
            stroke: #cbd5e1;
            stroke-width: 0.5;
        }

        #muzzle-flash {
            position: absolute;
            top: 6%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 240px; height: 240px;
            background: radial-gradient(circle, #fff 0%, var(--tactical-green) 45%, transparent 70%);
            display: none;
            z-index: 4;
            pointer-events: none;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--tactical-green);
            font-size: 36px;
            pointer-events: none;
            z-index: 6;
            display: none;
        }

        #notification {
            position: absolute;
            top: 25%; left: 50%;
            transform: translateX(-50%);
            font-size: 4rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 20px #000;
            z-index: 50;
            display: none;
            pointer-events: none;
            white-space: nowrap;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15, 5, 5, 0.98) 0%, rgba(0, 0, 0, 0.99) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }

        #overlay h1 {
            font-size: 6.5rem;
            margin-top: 0;
            margin-bottom: 2rem;
            letter-spacing: 16px;
            color: #d1c7bd;
            text-shadow: 0 0 35px rgba(153, 0, 0, 0.95), 0 0 50px rgba(0, 0, 0, 0.9);
            font-weight: 900;
        }

        #menu-options-container, #difficulty-options-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 105;
            width: 380px;
        }

        #difficulty-options-container {
            display: none; /* Controlled via JS */
        }

        .menu-btn {
            background: rgba(10, 5, 5, 0.75);
            border: 1px solid #444;
            color: #999;
            padding: 16px 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.25rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.6);
        }

        .menu-btn.active-mode {
            color: var(--tactical-green);
            border-color: var(--tactical-green);
        }

        .menu-btn.active-mode:hover {
            background: rgba(0, 255, 65, 0.12);
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.5);
            transform: scale(1.04);
        }

        #btn-diff-normal:hover { border-color: #00ff41; box-shadow: 0 0 25px rgba(0, 255, 65, 0.4); background: rgba(0, 255, 65, 0.08); color: #00ff41;}
        #btn-diff-medium:hover { border-color: #ffaa00; box-shadow: 0 0 25px rgba(255, 170, 0, 0.4); background: rgba(255, 170, 0, 0.08); color: #ffaa00;}
        #btn-diff-hard:hover { border-color: #ff5500; box-shadow: 0 0 25px rgba(255, 85, 0, 0.4); background: rgba(255, 85, 0, 0.08); color: #ff5500;}
        #btn-diff-impossible:hover { border-color: #ff3131; box-shadow: 0 0 25px rgba(255, 49, 49, 0.5); background: rgba(255, 49, 49, 0.1); color: #ff3131;}

        .menu-btn.locked-mode {
            color: #333;
            border-color: #1a1a1a;
            cursor: not-allowed;
        }

        #death-notice-sub {
            z-index: 105;
            font-size: 1.25rem;
            letter-spacing: 3px;
            text-shadow: 0 0 8px rgba(255, 49, 49, 0.4);
            color: var(--damage-red);
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .blink {
            animation: blinker 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes blinker { 50% { opacity: 0.15; } }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="damage-vignette"></div>
        <div id="heal-flash-vignette"></div>

        <div id="notification">WAVE 1 ARRIVING</div>
        <div id="overlay">
            <canvas id="menu-particles"></canvas>
            <h1 id="overlay-title">HALISCO</h1>
            
            <div id="menu-options-container">
                <button class="menu-btn active-mode" id="btn-uprising">Uprising (waves)</button>
                <button class="menu-btn locked-mode" disabled>Team Deathmatch</button>
                <button class="menu-btn locked-mode" disabled>Settings</button>
            </div>

            <div id="difficulty-options-container">
                <button class="menu-btn" id="btn-diff-normal">Normal</button>
                <button class="menu-btn" id="btn-diff-medium">Medium</button>
                <button class="menu-btn" id="btn-diff-hard">Hard</button>
                <button class="menu-btn" id="btn-diff-impossible">Impossible</button>
            </div>

            <p id="death-notice-sub" class="blink">CLICK TO GO BACK TO THE MAIN MENU</p>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div id="top-right-hud">
            <div id="hud-stats">
                <div class="hud-line"><span class="hud-label">RISK LEVEL:</span><span id="hud-diff" class="hud-val">-</span></div>
                <div class="hud-line"><span class="hud-label">WAVE:</span><span id="hud-wave" class="hud-val">1/4</span></div>
                <div class="hud-line"><span class="hud-label">KILLS:</span><span id="hud-kills" class="hud-val">0</span></div>
                <div class="hud-line"><span class="hud-label">REMAINING:</span><span id="hud-remain" class="hud-val">10</span></div>
                <div class="hud-line"><span class="hud-label">AMMO:</span><span id="hud-ammo" class="hud-val">30/30</span></div>
            </div>
            <canvas id="minimap" width="180" height="180"></canvas>
        </div>

        <div id="bottom-left-hud">
            <div class="health-label">Armor Integrity <span id="health-text">100%</span></div>
            <div id="health-bar-container">
                <div id="health-bar-fill"></div>
            </div>
        </div>

        <div id="bottom-middle-hud">
            <div class="hud-circle-wrapper">
                <div id="swap-preview-circle" class="hud-circle-container"></div>
                <div class="hud-hotkey-badge">1</div>
            </div>
            <div class="hud-circle-wrapper">
                <div id="medkit-circle" class="hud-circle-container"></div>
                <div id="medkit-cooldown-text" class="cooldown-overlay">20s</div>
                <div class="hud-hotkey-badge">2</div>
            </div>
        </div>

        <div id="bottom-right-hud">
            <div class="cooldown-label">AUX WEAPON</div>
            <div id="cooldown-status" class="status-ready">GRENADE: READY</div>
        </div>

        <div id="center-reload-hud">Reloading...</div>

        <div id="crosshair">⌖</div>
        
        <div id="weapon-wrapper">
            <div id="muzzle-flash"></div>
            <svg id="weapon-svg" viewBox="0 0 200 200"></svg>
        </div>

        <div id="grenade-arm-wrapper">
            <svg id="grenade-arm-svg" viewBox="0 0 200 200" style="width:100%; height:100%;"></svg>
        </div>

        <div id="medkit-use-wrapper">
            <svg id="medkit-use-svg" viewBox="0 0 200 200" style="width:100%; height:100%;"></svg>
        </div>
    </div>

<script>

const ctx = canvas.getContext('2d');

// NEW MAP & HEIGHT DESIGN MODIFIERS
const ENEMY_HEIGHT_SCALE = 0.72; // Slightly shorter threat models to match roof clearance
const ENEMY_Y_OFFSET = 0.14;     // Vertical offset alignment factor on the floor layout

let selectedDifficulty = 'Normal';

let isFiringContinuous = false;
let lastAutoShotTime = 0;
const AUTO_FIRE_RATE = 100;

const GUN_SVG_MARKUP = `

    <line x1="92" y1="55" x2="92" y2="75" stroke="#0d0d0e" stroke-width="1.5" />

function resizeCanvas() {

function createMenuParticle(initializeFullHeight = false) {
    const isFire = Math.random() > 0.40; 
    return {
        type: isFire ? 'fire' : 'ash',
        x: Math.random() * pCanvas.width,
        y: initializeFullHeight ? (Math.random() * pCanvas.height) : (pCanvas.height + 15),
        speed: isFire ? (1.0 + Math.random() * 1.8) : (0.4 + Math.random() * 0.9),
        size: isFire ? (2.0 + Math.random() * 4) : (2.5 + Math.random() * 5),
        maxSize: isFire ? 5 : 6,
        driftFreq: Math.random() * 0.02,
        driftPhase: Math.random() * Math.PI * 2,
        opacity: isFire ? (0.65 + Math.random() * 0.35) : (0.25 + Math.random() * 0.35),
        hue: isFire ? (Math.random() > 0.25 ? Math.floor(12 + Math.random() * 23) : Math.floor(35 + Math.random() * 25)) : 0 
    };
}

function initMenuParticles() {
    menuAshArray = [];
    for(let i = 0; i < 450; i++) {
        menuAshArray.push(createMenuParticle(true));
    }
}
initMenuParticles();

function handleMenuParticles() {
    if (gameState === 'playing') return;
    pctx.clearRect(0, 0, pCanvas.width, pCanvas.height);
    pctx.globalCompositeOperation = 'screen';

    menuAshArray.forEach((p, idx) => {
        p.y -= p.speed;
        p.x += Math.sin(p.y * p.driftFreq + p.driftPhase) * 0.5;

        if (p.type === 'fire') {
            p.size -= 0.008;
            p.opacity -= 0.0025;
            
            if (p.y < -10 || p.size <= 0.2 || p.opacity <= 0) {
                menuAshArray[idx] = createMenuParticle(false);
                return;
            }
            
            pctx.fillStyle = `hsla(${p.hue}, 100%, 50%, ${p.opacity * (0.75 + Math.random() * 0.25)})`;
            pctx.fillRect(p.x, p.y, p.size, p.size);
        } else {
            if (p.y < -10) {
                menuAshArray[idx] = createMenuParticle(false);
                return;
            }
            
            pctx.fillStyle = `rgba(110, 105, 105, ${p.opacity})`;
            pctx.fillRect(p.x, p.y, p.size, p.size);
        }
    });

    pctx.globalCompositeOperation = 'source-over';
}

function generateMap() {
    worldMap = [];
    for (let x = 0; x < MAP_SIZE; x++) {
        worldMap[x] = [];
        for (let y = 0; y < MAP_SIZE; y++) {
            if (x === 0 || x === MAP_SIZE - 1 || y === 0 || y === MAP_SIZE - 1) {
                worldMap[x][y] = 1; // Perimeter grid walls
            } else if (Math.random() < 0.15 && (x > 3 || y > 3)) {
                worldMap[x][y] = 1; // Obstacle points
            } else {
                worldMap[x][y] = 0;
            }
        }
    }
}

function startWave() {
    enemies = [];
    enemiesSpawnedInWave = getEnemiesForWave(wave);
    killsInWave = 0;
    
    document.getElementById('hud-wave').innerText = `${wave}/${MAX_WAVES}`;
    document.getElementById('hud-remain').innerText = enemiesSpawnedInWave;
    document.getElementById('hud-diff').innerText = selectedDifficulty.toUpperCase();
    document.getElementById('hud-diff').style.color = difficultyModifiers[selectedDifficulty].labelColor;

    showNotification(`WAVE ${wave} ARRIVING`, "var(--damage-orange)");
    triggerVoice(`Wave ${wave} initialized.`);

    let count = 0;
    while (count < enemiesSpawnedInWave) {
        let rx = Math.floor(Math.random() * (MAP_SIZE - 2)) + 1;
        let ry = Math.floor(Math.random() * (MAP_SIZE - 2)) + 1;
        if (worldMap[rx][ry] === 0 && (Math.abs(rx - player.x) > 2 || Math.abs(ry - player.y) > 2)) {
            enemies.push({
                x: rx + 0.5,
                y: ry + 0.5,
                health: 100 + (difficultyModifiers[selectedDifficulty].extraHealth),
                maxHealth: 100 + (difficultyModifiers[selectedDifficulty].extraHealth),
                speed: 0.02 + (wave * 0.005)
            });
            count++;
        }
    }
}

// CORE 3D SCENE RAYCASTER INCLUDING ROOF/CEILING RENDER LINES
function drawScene3D() {
    const halfHeight = canvas.height / 2;
    const pitchOffset = player.pitch;

    for (let x = 0; x < canvas.width; x++) {
        let cameraX = 2 * x / canvas.width - 1;
        let rayDirX = Math.cos(player.dir) + Math.sin(player.dir) * cameraX;
        let rayDirY = Math.sin(player.dir) - Math.cos(player.dir) * cameraX;

        let mapX = Math.floor(player.x);
        let mapY = Math.floor(player.y);

        let sideDistX, sideDistY;
        let deltaDistX = (rayDirX === 0) ? 1e30 : Math.abs(1 / rayDirX);
        let deltaDistY = (rayDirY === 0) ? 1e30 : Math.abs(1 / rayDirY);
        let perpWallDist;

        let stepX, stepY;
        let hit = 0;
        let side;

        if (rayDirX < 0) {
            stepX = -1;
            sideDistX = (player.x - mapX) * deltaDistX;
        } else {
            stepX = 1;
            sideDistX = (mapX + 1.0 - player.x) * deltaDistX;
        }
        if (rayDirY < 0) {
            stepY = -1;
            sideDistY = (player.y - mapY) * deltaDistY;
        } else {
            stepY = 1;
            sideDistY = (mapY + 1.0 - player.y) * deltaDistY;
        }

        while (hit === 0) {
            if (sideDistX < sideDistY) {
                sideDistX += deltaDistX;
                mapX += stepX;
                side = 0;
            } else {
                sideDistY += deltaDistY;
                mapY += stepY;
                side = 1;
            }
            if (worldMap[mapX] && worldMap[mapX][mapY] > 0) hit = 1;
        }

        if (side === 0) perpWallDist = (sideDistX - deltaDistX);
        else           perpWallDist = (sideDistY - deltaDistY);
        if (perpWallDist <= 0) perpWallDist = 0.01;

        let lineHeight = Math.floor(canvas.height / perpWallDist);
        let wallTop = Math.floor(halfHeight - lineHeight / 2) + pitchOffset;
        let wallBottom = Math.floor(halfHeight + lineHeight / 2) + pitchOffset;

        // --- ROOF / CEILING SYSTEM ---
        let ceilingGradient = ctx.createLinearGradient(x, 0, x, Math.max(0, wallTop));
        ceilingGradient.addColorStop(0, '#020b04'); // Dark metallic shadow depths
        ceilingGradient.addColorStop(1, '#08210d'); // Ambient light illumination closer to walls
        ctx.fillStyle = ceilingGradient;
        ctx.fillRect(x, 0, 1, Math.max(0, wallTop));

        // --- FLOOR LAYER ---
        ctx.fillStyle = '#060608';
        if(wallBottom < canvas.height) {
            ctx.fillRect(x, wallBottom, 1, canvas.height - wallBottom);
        }

        // --- WALL MATRIX MAPPING ---
        ctx.fillStyle = (side === 1) ? '#00b32d' : 'var(--tactical-green)';
        ctx.fillRect(x, Math.max(0, wallTop), 1, Math.min(canvas.height, wallBottom) - Math.max(0, wallTop));

        zBuffer[x] = perpWallDist;
    }
}

// 3D ENEMY RENDERING FOR SHORTER MODEL ADJUSTMENTS
function drawEnemies3D() {
    enemies.forEach(e => {
        e.dist = Math.hypot(e.x - player.x, e.y - player.y);
    });
    enemies.sort((a, b) => b.dist - a.dist);

    enemies.forEach(enemy => {
        let spriteX = enemy.x - player.x;
        let spriteY = enemy.y - player.y;

        let invDet = 1.0 / (Math.cos(player.dir) * Math.sin(player.dir) - Math.sin(player.dir) * Math.cos(player.dir));
        
        // Transform vector orientations
        let cos = Math.cos(-player.dir);
        let sin = Math.sin(-player.dir);
        let rotX = spriteX * cos - spriteY * sin;
        let rotY = spriteX * sin + spriteY * cos;

        if (rotY > 0.2) {
            let spriteScreenX = Math.floor((canvas.width / 2) * (1 + rotX / rotY));
            
            // Scaled Down Enemy Metrics to pass clearly underneath structural roof layers
            let baseHeightWidth = Math.abs(Math.floor(canvas.height / rotY));
            let spriteHeight = baseHeightWidth * ENEMY_HEIGHT_SCALE;
            let spriteWidth = baseHeightWidth * ENEMY_HEIGHT_SCALE;

            let drawStartY = Math.floor(canvas.height / 2 - spriteHeight / 2) + player.pitch + Math.floor(baseHeightWidth * ENEMY_Y_OFFSET);
            let drawStartX = Math.floor(spriteScreenX - spriteWidth / 2);

            let drawEndX = drawStartX + spriteWidth;

            for (let stripe = drawStartX; stripe < drawEndX; stripe++) {
                if (stripe > 0 && stripe < canvas.width && rotY < zBuffer[stripe]) {
                    // Display threat profile inside safe depth calculations
                    let healthRatio = enemy.health / enemy.maxHealth;
                    ctx.fillStyle = healthRatio > 0.4 ? 'var(--damage-red)' : 'var(--bloody-red)';
                    ctx.fillRect(stripe, drawStartY, 1, spriteHeight);

                    // Tiny tactical scan visor line overlay
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(stripe, drawStartY + Math.floor(spriteHeight * 0.22), 1, Math.max(1, Math.floor(spriteHeight * 0.06)));
                }
            }
        }
    });
}

function drawMinimap() {
    mctx.fillStyle = 'rgba(5, 5, 5, 0.85)';
    mctx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

    let blockWidth = minimapCanvas.width / MAP_SIZE;
    let blockHeight = minimapCanvas.height / MAP_SIZE;

    for (let x = 0; x < MAP_SIZE; x++) {
        for (let y = 0; y < MAP_SIZE; y++) {
            if (worldMap[x] && worldMap[x][y] === 1) {
                mctx.fillStyle = '#222';
                mctx.fillRect(x * blockWidth, y * blockHeight, blockWidth - 0.5, blockHeight - 0.5);
            }
        }
    }

    // Render Enemies inside minimap
    enemies.forEach(e => {
        mctx.fillStyle = 'var(--damage-red)';
        mctx.beginPath();
        mctx.arc(e.x * blockWidth, e.y * blockHeight, 3, 0, Math.PI * 2);
        mctx.fill();
    });

    // Render Player tracking dots
    mctx.fillStyle = 'var(--tactical-green)';
    mctx.beginPath();
    mctx.arc(player.x * blockWidth, player.y * blockHeight, 4, 0, Math.PI * 2);
    mctx.fill();

    // Small line pointing forward direction
    mctx.strokeStyle = 'var(--tactical-green)';
    mctx.lineWidth = 2;
    mctx.beginPath();
    mctx.moveTo(player.x * blockWidth, player.y * blockHeight);
    mctx.lineTo((player.x + Math.cos(player.dir) * 1.5) * blockWidth, (player.y + Math.sin(player.dir) * 1.5) * blockHeight);
    mctx.stroke();
}

function gameLoop() {
    if (gameState === 'playing') {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Core processing executions
        updateMovement();
        updateEnemiesAI();
        drawScene3D();
        drawEnemies3D();
        drawMinimap();
    } else {
        handleMenuParticles();
    }
    requestAnimationFrame(gameLoop);
}

function updateMovement() {
    let moveSpeed = player.speed;
    let nextX = player.x;
    let nextY = player.y;

    let forwardX = Math.cos(player.dir) * moveSpeed;
    let forwardY = Math.sin(player.dir) * moveSpeed;
    let strafeX = Math.cos(player.dir + Math.PI / 2) * moveSpeed;
    let strafeY = Math.sin(player.dir + Math.PI / 2) * moveSpeed;

    if (keys['w'] || keys['ArrowUp'])    { nextX += forwardX; nextY += forwardY; }
    if (keys['s'] || keys['ArrowDown'])  { nextX -= forwardX; nextY -= forwardY; }
    if (keys['a'])                      { nextX -= strafeX; nextY -= strafeY; }
    if (keys['d'])                      { nextX += strafeX; nextY += strafeY; }

    // Sliding collision responses
    if (worldMap[Math.floor(nextX)][Math.floor(player.y)] === 0) player.x = nextX;
    if (worldMap[Math.floor(player.x)][Math.floor(nextY)] === 0) player.y = nextY;
}

function updateEnemiesAI() {
    enemies.forEach(enemy => {
        let dx = player.x - enemy.x;
        let dy = player.y - enemy.y;
        let dist = Math.hypot(dx, dy);

        if (dist > 0.35) {
            let angle = Math.atan2(dy, dx);
            let nX = enemy.x + Math.cos(angle) * enemy.speed;
            let nY = enemy.y + Math.sin(angle) * enemy.speed;

            if (worldMap[Math.floor(nX)][Math.floor(enemy.y)] === 0) enemy.x = nX;
            if (worldMap[Math.floor(enemy.x)][Math.floor(nY)] === 0) enemy.y = nY;
        } else {
            // Apply hit box damage constraints
            if (Date.now() - player.lastDamageTime > 700) {
                player.health = Math.max(0, player.health - 12);
                player.lastDamageTime = Date.now();
                document.getElementById('health-text').innerText = `${player.health}%`;
                document.getElementById('health-bar-fill').style.width = `${player.health}%`;
                
                damageVignette.classList.add('blood-pulse');
                setTimeout(() => damageVignette.classList.remove('blood-pulse'), 80);

                if (player.health <= 0) {
                    executeDeathSequence();
                }
            }
        }
    });
}

function executeDeathSequence() {
    gameState = 'menu';
    document.exitPointerLock();
    overlay.style.display = 'flex';
    menuOptionsContainer.style.display = 'none';
    difficultyOptionsContainer.style.display = 'none';
    deathNoticeSub.style.display = 'block';

    overlayTitle.innerText = "CRITICAL FAILURE";
    overlayTitle.style.color = "var(--damage-red)";
    overlayTitle.style.textShadow = "0 0 25px rgba(255, 49, 49, 0.8)";
    triggerVoice("System offline. Armor structural collapse.");
}

function selectDifficultyMode() {
    menuOptionsContainer.style.display = 'none';
    difficultyOptionsContainer.style.display = 'flex';
    overlayTitle.innerText = "SELECT RISK LEVEL";
}

function startNewGame(difficultyChoice) {
    selectedDifficulty = difficultyChoice;
    gameContainer.style.cursor = 'pointer';
    wave = 1;
    player.health = 100;
    player.ammo = 30;
    player.x = 2.5; player.y = 2.5;
    player.dir = 0; player.pitch = 0;
    player.lastDamageTime = Date.now();

    document.getElementById('health-text').innerText = "100%";
    document.getElementById('health-bar-fill').style.width = "100%";
    document.getElementById('hud-ammo').innerText = "30/30";

    generateMap();
    startWave();
    
    gameState = 'playing';
    overlay.style.display = 'none';
    pCanvas.style.display = 'none';
    weaponWrap.style.display = 'block';
    grenadeArmWrap.style.display = 'block';
    medkitUseWrap.style.display = 'block';
    crosshair.style.display = 'block';
    topHUD.style.display = 'flex';
    bottomLeftHUD.style.display = 'flex';
    bottomMiddleHUD.style.display = 'flex';
    bottomRightHUD.style.display = 'block';
    
    renderEquippedWeapon();
    medkitCircle.innerHTML = `<svg viewBox="0 0 200 200">${MEDKIT_SVG_MARKUP}</svg>`;
    medkitUseSvg.innerHTML = FP_MEDKIT_USE_MARKUP;
    grenadeArmSvg.innerHTML = GRENADE_ARM_MARKUP;
    
    canvas.requestPointerLock();
}

function returnToMainMenu() {
    gameContainer.classList.remove('death-border');
    gameState = 'menu';
    pCanvas.style.display = 'block';
    overlay.style.display = 'flex';
    menuOptionsContainer.style.display = 'flex';
    difficultyOptionsContainer.style.display = 'none';
    deathNoticeSub.style.display = 'none';

    overlayTitle.innerText = "HALISCO";
    overlayTitle.style.color = "#d1c7bd";
    overlayTitle.style.textShadow = "0 0 35px rgba(153, 0, 0, 0.95), 0 0 50px rgba(0, 0, 0, 0.9)";
}

// Global window layout listeners
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

window.addEventListener('mousemove', e => {
    if (document.pointerLockElement === canvas && gameState === 'playing') {
        player.dir += e.movementX * 0.0025;
        player.pitch = Math.max(-180, Math.min(180, player.pitch - e.movementY * 1.5));
    }
});

btnUprising.addEventListener('click', selectDifficultyMode);
document.getElementById('btn-diff-normal').addEventListener('click', () => startNewGame('Normal'));
document.getElementById('btn-diff-medium').addEventListener('click', () => startNewGame('Medium'));
document.getElementById('btn-diff-hard').addEventListener('click', () => startNewGame('Hard'));
document.getElementById('btn-diff-impossible').addEventListener('click', () => startNewGame('Impossible'));
deathNoticeSub.addEventListener('click', returnToMainMenu);

// Start operational execution
gameLoop();
