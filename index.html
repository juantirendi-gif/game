<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halisco: Full Axis Ops</title>
    <style>
        :root {
            --tactical-green: #00ff41;
            --ui-bg: rgba(10, 10, 10, 0.95);
        }

        body {
            margin: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--tactical-green);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 2px solid #333;
            background: #000;
        }

        canvas { display: block; }

        #muzzle-flash {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            width: 120px; height: 120px;
            background: radial-gradient(circle, #fff 0%, var(--tactical-green) 40%, transparent 70%);
            display: none;
            z-index: 5;
        }

        #weapon-wrapper {
            position: absolute;
            bottom: -20px; left: 50%;
            transform: translateX(-50%);
            width: 320px;
            pointer-events: none;
            z-index: 10;
            transition: transform 0.1s ease-out;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--tactical-green);
            font-size: 28px;
            pointer-events: none;
        }

        #hud-msg {
            position: absolute;
            top: 15%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            font-weight: bold;
            text-shadow: 2px 2px #000;
        }

        #control-panel {
            width: 800px;
            background: var(--ui-bg);
            border: 2px solid #333;
            border-top: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        .stat-group { text-align: center; flex: 1; }
        .label { color: #666; font-size: 0.6rem; text-transform: uppercase; }
        .value { font-size: 1rem; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="muzzle-flash"></div>
        <div id="crosshair">⌖</div>
        <div id="hud-msg"></div>
        
        <div id="weapon-wrapper">
            <svg id="weapon" viewBox="0 0 200 200">
                <rect x="80" y="80" width="40" height="120" fill="#111" />
                <rect x="85" y="60" width="30" height="40" fill="#1a1a1a" />
                <rect x="92" y="40" width="16" height="30" fill="#222" />
                <rect x="94" y="35" width="12" height="5" fill="#00ff41" fill-opacity="0.5" />
            </svg>
        </div>
    </div>

    <div id="control-panel">
        <div class="stat-group" style="text-align: left;">
            <div class="label">Aiming Mode</div>
            <div class="value">FULL 2-AXIS</div>
        </div>

        <div class="stat-group">
            <div class="label">Tactical Ammo</div>
            <div class="value" id="ammo-count">30 / 30</div>
        </div>

        <div class="stat-group">
            <div class="label">Refills</div>
            <div class="value" id="scavenge-count">0 / 10</div>
        </div>

        <div class="stat-group" style="text-align: right;">
            <div class="label">System</div>
            <div class="value" style="color: #00ff41;">READY</div>
        </div>
    </div>
